<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컴퓨터실습실 게시용 현황판</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  /* ===== 테마 변수 (기본값 = 다크모드) ===== */
  /* ===== 다크모드: 중립 검정~차콜, 초록은 포인트로만, 숫자는 금색 강조 ===== */
  :root {
    --did-bg: radial-gradient(ellipse at top, #17171a 0%, #08080a 70%);
    --did-text: #f5f5f4;
    --did-text-dim: rgba(245,245,244,0.7);
    --did-text-faint: rgba(245,245,244,0.5);

    --did-card-bg: linear-gradient(160deg, #232326 0%, #131315 100%);
    --did-card-border: 1px solid rgba(255,255,255,0.08);
    --did-card-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(74,222,128,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    --did-card-gloss: rgba(74,222,128,0.07);
    --did-card-blur: none;
    --did-card-text: #ffffff;
    --did-card-text-soft: #6ee7b7;
    --did-card-num-grad: linear-gradient(135deg, #fde68a, #f59e0b);
    --did-card-unit-text: #fcd34d;
    --did-room-shadow: none;
    --did-tag-bg: rgba(255,255,255,0.06);
    --did-tag-text: rgba(245,245,244,0.85);
    --did-tag-border: rgba(255,255,255,0.14);

    --did-ghost-bg: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    --did-ghost-border: rgba(74,222,128,0.22);
    --did-ghost-dim-bg: linear-gradient(160deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
    --did-ghost-dim-border: rgba(74,222,128,0.12);

    --did-dot-inactive: rgba(255,255,255,0.18);
    --did-dot-active: #4ade80;
    --did-outline-text-shadow: none;

    --did-toggle-bg: rgba(255,255,255,0.08);
    --did-toggle-border: rgba(255,255,255,0.18);
    --did-toggle-knob: #232326;
  }

  /* ===== 화이트모드: 깨끗한 흰색, 에메랄드 그린으로 포인트 ===== */
  body.theme-light {
    --did-bg: linear-gradient(160deg, #ffffff 0%, #eef2f6 100%);
    --did-text: #111827;
    --did-text-dim: rgba(17,24,39,0.65);
    --did-text-faint: rgba(17,24,39,0.48);

    --did-card-bg: #ffffff;
    --did-card-border: 1px solid #e5e7eb;
    --did-card-shadow: 0 12px 32px rgba(15,23,42,0.10), 0 2px 8px rgba(15,23,42,0.06);
    --did-card-gloss: rgba(16,185,129,0.04);
    --did-card-blur: none;
    --did-card-text: #111827;
    --did-card-text-soft: #059669;
    --did-card-num-grad: linear-gradient(135deg, #10b981, #059669);
    --did-card-unit-text: #047857;
    --did-room-shadow: none;
    --did-tag-bg: #ecfdf5;
    --did-tag-text: #047857;
    --did-tag-border: #a7f3d0;

    --did-ghost-bg: rgba(15,23,42,0.03);
    --did-ghost-border: rgba(15,23,42,0.10);
    --did-ghost-dim-bg: rgba(15,23,42,0.015);
    --did-ghost-dim-border: rgba(15,23,42,0.06);

    --did-dot-inactive: rgba(15,23,42,0.15);
    --did-dot-active: #059669;
    --did-outline-text-shadow: none;

    --did-toggle-bg: #e5e7eb;
    --did-toggle-border: #d1d5db;
    --did-toggle-knob: #ffffff;
  }



  body {
    font-family: 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background: var(--did-bg);
    color: var(--did-text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 3vh 4vw;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  .did-top { display: flex; justify-content: space-between; align-items: center; gap: 2vw; margin-bottom: 3vh; text-shadow: var(--did-outline-text-shadow); }

  .theme-toggle {
    position: relative;
    width: 4.2vw;
    height: 2.1vw;
    min-width: 52px;
    min-height: 26px;
    border-radius: 999px;
    border: 1px solid var(--did-toggle-border);
    background: var(--did-toggle-bg);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  .theme-toggle .knob {
    position: absolute;
    top: 50%;
    left: 3px;
    width: calc(2.1vw - 6px);
    height: calc(2.1vw - 6px);
    min-width: 20px;
    min-height: 20px;
    border-radius: 50%;
    background: var(--did-toggle-knob);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1vw;
    transform: translateY(-50%);
    transition: left 0.3s cubic-bezier(.4,0,.2,1), background 0.3s;
  }
  body.theme-light .theme-toggle .knob { left: calc(100% - (2.1vw - 6px) - 3px); }

  .theme-controls { display: flex; align-items: center; gap: 0.8vw; }
  .auto-toggle {
    display: flex;
    align-items: center;
    gap: 0.4vw;
    border: 1px solid var(--did-toggle-border);
    background: var(--did-toggle-bg);
    color: var(--did-text-dim);
    border-radius: 999px;
    padding: 0.5vh 1vw;
    font-size: 1.1vw;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .auto-toggle.active {
    background: rgba(74,222,128,0.18);
    border-color: rgba(74,222,128,0.5);
    color: #4ade80;
  }
  .did-title { font-size: 3.2vw; font-weight: 900; }
  .did-clockbox { text-align: right; }
  #didClock { font-size: 4vw; font-weight: 900; font-variant-numeric: tabular-nums; }
  .did-datebox { display: block; font-size: 1.6vw; color: var(--did-text-dim); }
  .did-common-sw { text-align: center; font-size: 1.3vw; color: var(--did-text-faint); margin-bottom: 2vh; text-shadow: var(--did-outline-text-shadow); }
  .did-common-sw b { color: var(--did-text); font-weight: 700; }

  .did-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  .did-deck { position: relative; width: 100%; display: flex; justify-content: center; }
  .did-ghost-layer {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    height: 100%;
    display: grid;
    grid-template-columns: 42vw 42vw;
    gap: 3vw;
    z-index: 0;
  }
  .did-ghost-card {
    border-radius: 28px;
    background: var(--did-ghost-bg);
    border: 2px solid var(--did-ghost-border);
  }
  .did-ghost-card.dim {
    background: var(--did-ghost-dim-bg);
    border: 2px solid var(--did-ghost-dim-border);
  }
  .did-flex {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 42vw 42vw;
    gap: 3vw;
    opacity: 0;
    transform: scale(0.96);
  }
  .did-flex.single { grid-template-columns: 42vw; }
  .did-stage.enter .did-flex { animation: didIn 0.6s ease forwards; }
  @keyframes didIn { to { opacity: 1; transform: scale(1); } }

  .did-card {
    position: relative;
    flex-shrink: 0;
    background: var(--did-card-bg);
    border: var(--did-card-border);
    border-radius: 28px;
    padding: 5vh 3vw;
    text-align: center;
    box-sizing: border-box;
    box-shadow: var(--did-card-shadow);
    backdrop-filter: var(--did-card-blur);
    -webkit-backdrop-filter: var(--did-card-blur);
    overflow: hidden;
    color: var(--did-card-text);
  }
  .did-card::before {
    content: '';
    position: absolute;
    top: -40%; left: -20%;
    width: 70%; height: 90%;
    background: radial-gradient(ellipse, var(--did-card-gloss), transparent 70%);
    pointer-events: none;
  }
  .did-building { font-size: 2vw; font-weight: 700; opacity: 0.85; position: relative; }
  .did-room { font-size: 4.5vw; font-weight: 900; margin: 1vh 0 2vh; color: var(--did-card-text); text-shadow: var(--did-room-shadow); position: relative; }
  .did-pc { margin-bottom: 1.5vh; position: relative; }
  .did-pc-num {
    font-size: 7vw;
    font-weight: 900;
    background: var(--did-card-num-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
  }
  .did-pc-unit { font-size: 1.8vw; font-weight: 700; margin-left: 0.5vw; color: var(--did-card-unit-text); }
  .did-until { font-size: 2vw; font-weight: 700; color: var(--did-card-text-soft); position: relative; }
  .did-spec { font-size: 1.2vw; color: var(--did-card-text-soft); opacity: 0.85; margin-top: 1vh; position: relative; }
  .did-sw { margin-top: 1.5vh; display: flex; justify-content: center; gap: 0.8vw; flex-wrap: wrap; position: relative; }
  .did-sw .sw-tag {
    font-size: 1.4vw;
    font-weight: 700;
    padding: 0.6vh 1.2vw;
    background: var(--did-tag-bg);
    color: var(--did-tag-text);
    border: 1px solid var(--did-tag-border);
    border-radius: 20px;
  }

  .did-msg { font-size: 3vw; font-weight: 800; color: var(--did-text-faint); text-align: center; text-shadow: var(--did-outline-text-shadow); }

  .did-progress { display: flex; flex-direction: column; align-items: center; gap: 1vh; margin-top: 2vh; text-shadow: var(--did-outline-text-shadow); }
  .did-dots { display: flex; gap: 0.8vw; }
  .did-dot { width: 0.9vw; height: 0.9vw; border-radius: 50%; background: var(--did-dot-inactive); transition: background 0.3s, transform 0.3s; }
  .did-dot.active { background: var(--did-dot-active); transform: scale(1.3); }
  .did-count { font-size: 1.3vw; color: var(--did-text-faint); font-weight: 600; }
</style>
</head>
<body>
  <div class="did-top">
    <div class="did-title">🖥️ 컴퓨터실습실 지금 사용 가능</div>
    <div class="theme-controls">
      <button class="auto-toggle" id="autoToggleBtn" onclick="toggleAuto()" title="낮에는 화이트, 밤에는 다크로 자동 전환">🕐 자동</button>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="화면 테마 전환">
        <span class="knob" id="themeKnob">🌙</span>
      </button>
    </div>
    <div class="did-clockbox"><span id="didClock">--:--</span><span id="didDate" class="did-datebox"></span></div>
  </div>
  <div id="didCommonSw" class="did-common-sw"></div>
  <div id="didStage" class="did-stage"></div>
  <div id="didProgress" class="did-progress"></div>

<script>
  // ▼▼▼ 여기에 Apps Script 배포 주소를 넣어주세요 (예: https://script.google.com/macros/s/xxxxx/exec) ▼▼▼
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';
  // ▲▲▲

  const TOKEN = new URLSearchParams(location.search).get('t') || '';

  // 테마 선택 — 수동(dark/light) 또는 자동(auto: 낮엔 화이트, 밤엔 다크)
  let themeMode = 'dark';  // 저장되는 값: 'dark' | 'light' | 'auto'
  try { themeMode = localStorage.getItem('dash_did_theme') || 'dark'; } catch (e) {}

  // 낮/밤 판정 — 강릉 좌표 기준 그날의 실제 일출·일몰 시각으로 판정 (API 실패 시 07시~19시로 대체)
  const CAMPUS_LAT = 37.7519, CAMPUS_LNG = 128.8761;
  let sunTimes = null;      // { sunrise: Date, sunset: Date }
  let sunTimesDate = '';    // 이 값을 구한 날짜(로컬 yyyy-MM-dd) — 날짜가 바뀌면 다시 받아옴

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function refreshSunTimes() {
    const key = todayKey();
    if (sunTimesDate === key && sunTimes) return Promise.resolve(sunTimes);

    // 캐시(로컬 저장소)에 오늘 값이 있으면 재사용 — 매번 API를 부르지 않음
    try {
      const cached = JSON.parse(localStorage.getItem('dash_did_suntimes') || 'null');
      if (cached && cached.dateKey === key) {
        sunTimes = { sunrise: new Date(cached.sunrise), sunset: new Date(cached.sunset) };
        sunTimesDate = key;
        return Promise.resolve(sunTimes);
      }
    } catch (e) {}

    return fetch('https://api.sunrise-sunset.org/json?lat=' + CAMPUS_LAT + '&lng=' + CAMPUS_LNG + '&formatted=0')
      .then(res => res.json())
      .then(data => {
        if (!data || data.status !== 'OK') throw new Error('sun api fail');
        sunTimes = { sunrise: new Date(data.results.sunrise), sunset: new Date(data.results.sunset) };
        sunTimesDate = key;
        try {
          localStorage.setItem('dash_did_suntimes', JSON.stringify({
            dateKey: key, sunrise: sunTimes.sunrise.toISOString(), sunset: sunTimes.sunset.toISOString()
          }));
        } catch (e) {}
        return sunTimes;
      })
      .catch(() => { sunTimes = null; return null; });
  }

  function computeAutoTheme() {
    const now = new Date();
    if (sunTimes) {
      return (now >= sunTimes.sunrise && now < sunTimes.sunset) ? 'light' : 'dark';
    }
    // API를 아직 못 받아왔을 때의 대체 기준
    const h = now.getHours();
    return (h >= 7 && h < 19) ? 'light' : 'dark';
  }

  function applyVisual(effectiveTheme) {
    document.body.classList.toggle('theme-light', effectiveTheme === 'light');
    const knob = document.getElementById('themeKnob');
    if (knob) knob.textContent = (effectiveTheme === 'light') ? '☀️' : '🌙';
  }

  function refreshTheme() {
    const autoBtn = document.getElementById('autoToggleBtn');
    if (themeMode === 'auto') {
      if (autoBtn) autoBtn.classList.add('active');
      applyVisual(computeAutoTheme());
    } else {
      if (autoBtn) autoBtn.classList.remove('active');
      applyVisual(themeMode);
    }
  }

  function toggleTheme() {
    // 수동으로 스위치를 직접 누르면, 자동 모드는 해제되고 그 상태로 고정됨
    const currentlyLight = document.body.classList.contains('theme-light');
    themeMode = currentlyLight ? 'dark' : 'light';
    try { localStorage.setItem('dash_did_theme', themeMode); } catch (e) {}
    refreshTheme();
  }

  function toggleAuto() {
    themeMode = (themeMode === 'auto') ? computeAutoTheme() : 'auto';
    try { localStorage.setItem('dash_did_theme', themeMode); } catch (e) {}
    refreshTheme();
  }

  refreshTheme();
  refreshSunTimes().then(refreshTheme);  // 일출·일몰 시각 도착하면 즉시 한 번 더 정확히 반영

  // 자동 모드일 때, 전광판처럼 오래 켜둬도 시간대가 바뀌면 알아서 넘어가도록 10분마다 재확인
  setInterval(function() {
    if (themeMode === 'auto') {
      refreshSunTimes().then(refreshTheme);  // 날짜가 바뀌었으면 새 일출·일몰 값도 같이 갱신
    }
  }, 10 * 60 * 1000);

  function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function parseBuilding(name) {
    const m = name.match(/^(.+?\))\s*(.+)$/);
    return m ? m[1] : '기타';
  }
  function parseRoomOnly(name) {
    const m = name.match(/^(.+?\))\s*(.+)$/);
    return m ? m[2] : name;
  }
  function parseBuildingCode(roomId) {
    return String(roomId || '').split('-')[0] || '';
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('didClock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }

  function fetchDashboardData() {
    return fetch(GAS_URL + '?page=api&action=dashboard&t=' + encodeURIComponent(TOKEN)).then(res => res.json());
  }

  function load() {
    if (!TOKEN || GAS_URL.indexOf('GAS_배포_주소') !== -1) {
      document.getElementById('didStage').innerHTML = '<div class="did-msg">설정이 완료되지 않았습니다.<br>주소(?t=)와 GAS_URL을 확인해주세요.</div>';
      return;
    }
    fetchDashboardData()
      .then(applyData)
      .catch(err => {
        document.getElementById('didStage').innerHTML = '<div class="did-msg">조회 실패: ' + escapeHtml(err.message) + '</div>';
      });
  }

  let didSlideRooms = [];
  let didSlideIndex = 0;
  let didTotalSlides = 1;
  let didSlideTimer = null;
  let prefetchedRes = null;
  let prefetching = false;

  function applyData(res) {
    if (!res || !res.success) {
      document.getElementById('didStage').innerHTML = '<div class="did-msg">' + escapeHtml((res && res.message) || '조회 실패') + '</div>';
      return;
    }
    document.getElementById('didDate').textContent = res.today || '';

    const commonEl = document.getElementById('didCommonSw');
    if (res.commonSwTags && res.commonSwTags.length > 0) {
      commonEl.innerHTML = '공통 설치: <b>' + res.commonSwTags.map(escapeHtml).join(' · ') + '</b>';
    } else {
      commonEl.innerHTML = '';
    }

    didSlideRooms = res.rooms.filter(r => r.status === 'available')
      .sort((a, b) => parseBuildingCode(a.roomId).localeCompare(parseBuildingCode(b.roomId), undefined, {numeric:true}) || a.roomName.localeCompare(b.roomName));

    didTotalSlides = Math.max(1, Math.ceil(didSlideRooms.length / 2));
    didSlideIndex = 0;

    if (!didSlideTimer) {
      didSlideTimer = setInterval(advanceSlide, 6000);
    }
    renderSlide();
  }

  function render(res) { applyData(res); }

  function getSlideCardCount(slideIdx) {
    const start = slideIdx * 2;
    return Math.max(0, Math.min(2, didSlideRooms.length - start));
  }

  function advanceSlide() {
    const nextIndex = didSlideIndex + 1;

    if (nextIndex === didTotalSlides - 1 && !prefetching && !prefetchedRes) {
      prefetching = true;
      fetchDashboardData().then(function(res) {
        prefetchedRes = res;
        prefetching = false;
      }).catch(function() { prefetching = false; });
    }

    if (nextIndex >= didTotalSlides) {
      if (prefetchedRes) {
        const res = prefetchedRes;
        prefetchedRes = null;
        applyData(res);
      } else {
        fetchDashboardData().then(applyData);
      }
    } else {
      didSlideIndex = nextIndex;
      renderSlide();
    }
  }

  function renderGhostStack() {
    const remaining = Math.max(0, didTotalSlides - 1 - didSlideIndex);
    const layers = Math.min(2, remaining);
    let html = '';
    for (let i = layers; i >= 1; i--) {
      const futureCount = getSlideCardCount(didSlideIndex + i);
      const offset = i * 1.6;
      const dimClass = (i === 2) ? ' dim' : '';
      let cards = '<div class="did-ghost-card' + dimClass + '"></div>';
      cards += (futureCount === 2) ? ('<div class="did-ghost-card' + dimClass + '"></div>') : '<div></div>';
      html += '<div class="did-ghost-layer" style="top:' + offset + 'vh;transform:translate(-50%, 0) translateX(' + offset + 'vw);">' + cards + '</div>';
    }
    return html;
  }

  function renderProgress(start, shownCount) {
    const el = document.getElementById('didProgress');
    if (didTotalSlides <= 1) { el.innerHTML = ''; return; }

    let dots = '';
    for (let i = 0; i < didTotalSlides; i++) {
      dots += '<div class="did-dot' + (i === didSlideIndex ? ' active' : '') + '"></div>';
    }

    const from = start + 1;
    const to = start + shownCount;
    const total = didSlideRooms.length;
    const countText = (from === to)
      ? (from + ' / ' + total + '실 표시 중')
      : (from + '–' + to + ' / ' + total + '실 표시 중');

    el.innerHTML = '<div class="did-dots">' + dots + '</div><div class="did-count">' + countText + '</div>';
  }

  function renderSlide() {
    const stage = document.getElementById('didStage');
    if (didSlideRooms.length === 0) {
      stage.innerHTML = '<div class="did-msg">지금 사용 가능한 실습실이 없습니다</div>';
      document.getElementById('didProgress').innerHTML = '';
      return;
    }

    if (didSlideIndex >= didTotalSlides) didSlideIndex = 0;
    const start = didSlideIndex * 2;
    const slice = didSlideRooms.slice(start, start + 2);

    const html = slice.map(function(r) {
      let sw = '';
      if (r.swTags && r.swTags.length > 0) {
        sw = '<div class="did-sw">' + r.swTags.slice(0, 3).map(function(s) { return '<span class="sw-tag">' + escapeHtml(s) + '</span>'; }).join('') + '</div>';
      }
      const specLine = r.pcSpec ? '<div class="did-spec">' + escapeHtml(r.pcSpec) + '</div>' : '';
      return '<div class="did-card">' +
        '<div class="did-building">' + escapeHtml(parseBuilding(r.roomName)) + '</div>' +
        '<div class="did-room">' + escapeHtml(parseRoomOnly(r.roomName)) + '</div>' +
        '<div class="did-pc"><span class="did-pc-num">' + r.pcCount + '</span><span class="did-pc-unit">대 사용가능</span></div>' +
        '<div class="did-until">' + escapeHtml(r.availableUntil) + '</div>' +
        specLine + sw +
      '</div>';
    }).join('');

    stage.classList.remove('enter');
    void stage.offsetWidth;
    const singleClass = (slice.length === 1) ? ' single' : '';
    stage.innerHTML = '<div class="did-deck">' + renderGhostStack() + '<div class="did-flex' + singleClass + '">' + html + '</div></div>';
    stage.classList.add('enter');

    renderProgress(start, slice.length);
  }

  load();
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
