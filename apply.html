<style>
/* ====== 공통 테마 (다른 페이지와 동일) ====== */

html { background: var(--bg); }
select option, select optgroup, option, optgroup { background-color: var(--surface-pop) !important; color: var(--text) !important; }

  position: fixed; left: 14px; bottom: 14px; z-index: 99999;

<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '☀️' : '🌙';
      b.title = (m === 'dark') ? '화이트 테마로 전환' : '다크 테마로 전환';
      b.setAttribute('aria-label', b.title);
    }
  }
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';
  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }

  const START_HOUR = 9, END_HOUR = 22, SLOT_MIN = 30;
  let maxAdvanceDays = 30;

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatLocalISODate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function t2m(t) { const p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  function m2t(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function mondayOfDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return formatLocalISODate(d);
  }

  function fillTimeSelect(selectEl, defaultMin) {
    const totalSlots = ((END_HOUR - START_HOUR) * 60) / SLOT_MIN;
    for (let s = 0; s <= totalSlots; s++) {
      const totalMin = START_HOUR * 60 + s * SLOT_MIN;
      const opt = document.createElement('option');
      opt.value = String(totalMin);
      opt.textContent = m2t(totalMin);
      if (totalMin === defaultMin) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }

  // 건물코드 → [위도, 경도] ("가까운 건물" 조건의 직선거리 계산용 — allrooms.html과 동일)
  const BUILDING_COORDS = {
    N1: [37.77037, 128.87368], N2: [37.77140, 128.87322], N4: [37.77282, 128.87335],
    N5: [37.77089, 128.87146], N6: [37.77155, 128.87178], N7: [37.77194, 128.87219],
    N8: [37.77104, 128.87070], N9: [37.77156, 128.87091], N10: [37.77140, 128.87040],
    N11: [37.77201, 128.86813], N12: [37.77187, 128.86954], N13: [37.77079, 128.86883],
    N14: [37.77055, 128.86746], N15: [37.77041, 128.86698], N16: [37.77089, 128.86691],
    N17: [37.77073, 128.86609], N18: [37.77219, 128.86690], N20: [37.77155, 128.86828],
    C1: [37.76978, 128.87320], C2: [37.76870, 128.87226], C3: [37.76885, 128.87128],
    C4: [37.76885, 128.87081], C5: [37.76968, 128.87022], C6: [37.77016, 128.86897],
    C7: [37.76911, 128.86939], C8: [37.76907, 128.86993], C9: [37.76829, 128.87007],
    C10: [37.76832, 128.86831], C11: [37.76883, 128.86919], C12: [37.76767, 128.86931],
    C13: [37.76699, 128.86847], C14: [37.76688, 128.86888], C15: [37.76615, 128.86852],
    C16: [37.76739, 128.86725], C17: [37.76756, 128.87108],
    D3: [37.76694, 128.87129], D4: [37.76670, 128.87188], D5: [37.76617, 128.87217],
    D6: [37.76703, 128.87261], D7: [37.76494, 128.87158], D8: [37.76747, 128.87185],
    D9: [37.76630, 128.87066],
    S1: [37.76525, 128.87031], S2: [37.76566, 128.86985], S3: [37.76515, 128.86957],
    S4: [37.76455, 128.87099]
  };
  api({ action: 'buildingcoords' })
    .then(res => { if (res && res.success && res.coords) Object.keys(res.coords).forEach(c => { BUILDING_COORDS[c] = res.coords[c]; }); })
    .catch(() => {});

  function parseBuildingCode(roomId) { return String(roomId || '').split('-')[0] || ''; }
  function haversineM(lat1, lng1, lat2, lng2) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  let ALL_ROOMS = [];         // action=rooms 응답 전체(메타: 건물·SW 등)
  let SW_OPTIONS = [];
  let BUILDING_LABELS = {};   // { code: '건물명(코드)' }
  let roomsLoaded = false;

  function loadRoomsMeta() {
    return api({ action: 'rooms' }).then(res => {
      if (!res || !res.success || !res.rooms) throw new Error((res && res.message) || '실습실 목록을 불러오지 못했습니다.');
      ALL_ROOMS = res.rooms;
      const swSeen = {};
      ALL_ROOMS.forEach(r => {
        (r.software || []).forEach(sw => { if (sw && sw.code && !swSeen[sw.code]) { swSeen[sw.code] = true; SW_OPTIONS.push(sw); } });
        const code = r.building || parseBuildingCode(r.id);
        if (code && !BUILDING_LABELS[code]) {
          const m = String(r.name || '').match(/^(.+?\))/);
          BUILDING_LABELS[code] = m ? m[1] : code;
        }
      });
      SW_OPTIONS.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      roomsLoaded = true;
      fillConditionOptions();
    });
  }

  function fillConditionOptions() {
    const swSel = document.getElementById('searchSw');
    SW_OPTIONS.forEach(sw => {
      const opt = document.createElement('option');
      opt.value = sw.code;
      opt.textContent = sw.name + (sw.version ? ' ' + sw.version : '');
      swSel.appendChild(opt);
    });
    const nearSel = document.getElementById('searchNear');
    Object.keys(BUILDING_LABELS).filter(c => BUILDING_COORDS[c]).sort((a, b) => BUILDING_LABELS[a].localeCompare(BUILDING_LABELS[b])).forEach(code => {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = BUILDING_LABELS[code];
      nearSel.appendChild(opt);
    });
  }

  // 선택한 날짜가 속한 주(월요일)의 시간표를 방마다 조회해, 그 날짜의 빈 시간대를 가진 곳만 추린다.
  // (오늘의 전체 시간표가 쓰는 action=allrooms는 현황판 전용 토큰이 있어야 해서,
  //  이 페이지는 누구나 바로 쓸 수 있도록 request.html과 같은 공개 API만 사용한다.)
  function fetchRoomDay(room, dateStr) {
    const monday = mondayOfDate(dateStr);
    return api({ action: 'roomschedule', id: room.id, week: monday })
      .then(res => {
        if (!res || !res.success) return null;
        return (res.schedule || []).find(d => d.date === dateStr) || null;
      })
      .catch(() => null);
  }

  function runSearch() {
    const dateStr = document.getElementById('searchDate').value;
    const startMin = parseInt(document.getElementById('searchStart').value, 10);
    const endMin = parseInt(document.getElementById('searchEnd').value, 10);
    const swCode = document.getElementById('searchSw').value;
    const nearCode = document.getElementById('searchNear').value;

    const resultsEl = document.getElementById('resultsArea');
    if (!dateStr) {
      resultsEl.innerHTML = '<div class="results-empty">먼저 날짜를 선택해주세요.</div>';
      return;
    }
    if (!(endMin > startMin)) {
      resultsEl.innerHTML = '<div class="results-empty">종료 시간은 시작 시간보다 늦어야 해요.</div>';
      return;
    }

    const btn = document.getElementById('searchGoBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span>찾는 중...';
    resultsEl.innerHTML = '<div class="results-loading"><span class="spin"></span>실습실별 시간표를 확인하고 있어요...</div>';

    const ready = roomsLoaded ? Promise.resolve() : loadRoomsMeta();
    ready.then(() => {
      return Promise.all(ALL_ROOMS.map(room => fetchRoomDay(room, dateStr).then(day => ({ room, day }))));
    }).then(pairs => {
      const results = [];
      pairs.forEach(({ room, day }) => {
        if (!day || day.isHolidayBlocked) return;  // 그 날짜에 아예 신청 불가(휴일 등)
        const overlap = (day.blocks || []).some(b => t2m(b.start) < endMin && t2m(b.end) > startMin);
        if (overlap) return;
        if (swCode) {
          const has = (room.software || []).some(sw => sw.code === swCode);
          if (!has) return;
        }
        const building = room.building || parseBuildingCode(room.id);
        let distM = null;
        if (nearCode && BUILDING_COORDS[nearCode] && BUILDING_COORDS[building]) {
          const a = BUILDING_COORDS[nearCode], b = BUILDING_COORDS[building];
          distM = haversineM(a[0], a[1], b[0], b[1]);
        }
        results.push({ room, distM, building });
      });
      if (nearCode) results.sort((x, y) => (x.distM === null ? Infinity : x.distM) - (y.distM === null ? Infinity : y.distM));
      else results.sort((x, y) => String(x.room.id).localeCompare(String(y.room.id), undefined, { numeric: true }));
      renderResults(results, dateStr, startMin, endMin);
    }).catch(err => {
      resultsEl.innerHTML = '<div class="results-empty">조회에 실패했습니다: ' + escapeHtml(err.message || String(err)) + '</div>';
    }).finally(() => {
      btn.disabled = false;
      btn.textContent = '🔍 사용 가능한 실습실 찾기';
    });
  }

  function renderResults(results, dateStr, startMin, endMin) {
    const resultsEl = document.getElementById('resultsArea');
    const d = new Date(dateStr + 'T00:00:00');
    const dowMap = ['일', '월', '화', '수', '목', '금', '토'];
    const dateLabel = (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + dowMap[d.getDay()] + ') ' + m2t(startMin) + '~' + m2t(endMin);

    if (results.length === 0) {
      resultsEl.innerHTML = '<div class="results-head">' + escapeHtml(dateLabel) + '</div>' +
        '<div class="results-empty">조건에 맞는 빈 실습실이 없어요.<br>시간대를 바꾸거나 조건을 줄여서 다시 찾아보세요.</div>';
      return;
    }

    const items = results.map(({ room, distM }) => {
      const link = 'request.html?room=' + encodeURIComponent(room.id) + '&date=' + dateStr +
        '&name=' + encodeURIComponent(room.name) + (room.seats ? '&seats=' + encodeURIComponent(room.seats) : '') +
        '&start=' + m2t(startMin) + '&end=' + m2t(endMin);
      const metaParts = [];
      if (room.seats) metaParts.push(room.seats + '석');
      if (distM !== null && distM !== undefined) metaParts.push(Math.round(distM) + 'm');
      let metaHtml = metaParts.map(escapeHtml).join(' <span class="sep">·</span> ');
      if (room.software && room.software.length > 0) {
        metaHtml += (metaHtml ? ' ' : '') + room.software.slice(0, 2).map(sw => '<span class="result-sw">' + escapeHtml(sw.name) + '</span>').join(' ');
      }
      return '<a class="result-card" href="' + link + '" target="_blank" rel="noopener">' +
        '<div class="result-main">' +
          '<div class="result-name">' + escapeHtml(room.name) + '</div>' +
          '<div class="result-meta">' + metaHtml + '</div>' +
        '</div>' +
        '<div class="result-arrow">→</div>' +
      '</a>';
    }).join('');

    resultsEl.innerHTML = '<div class="results-head">' + escapeHtml(dateLabel) + ' · ' + results.length + '곳 가능</div>' +
      '<div class="results-list">' + items + '</div>';
  }

  function goToMypage() { window.location.href = 'mypage.html'; }
  function goToManual() {
    document.getElementById('manualModal').style.display = 'block';
    document.getElementById('manualIframe').src = GAS_URL + '?page=manual';
  }
  function closeManualModal() {
    document.getElementById('manualModal').style.display = 'none';
    document.getElementById('manualIframe').src = '';
  }

  // ── 초기화 ──
  // 날짜·시간은 사용자가 직접 고르기 전까지 비워둔다(기본값을 넣지 않음) — 그래서
  // 여기서는 검색을 미리 실행하지 않고, 조건 선택지(SW·건물 목록)만 조용히 채워둔다.
  (function init() {
    const dateInput = document.getElementById('searchDate');
    dateInput.min = formatLocalISODate(new Date());

    fillTimeSelect(document.getElementById('searchStart'));
    fillTimeSelect(document.getElementById('searchEnd'));

    api({ action: 'maxadvancedays' }).then(res => {
      if (res && res.days) {
        maxAdvanceDays = res.days;
        const maxD = new Date(); maxD.setDate(maxD.getDate() + maxAdvanceDays);
        dateInput.max = formatLocalISODate(maxD);
      }
    }).catch(() => {});

    loadRoomsMeta().catch(() => {});
  })();
</script>
