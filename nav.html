<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>실습실 위치</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background: #1a1a1d;
    color: #f5f5f4;
    display: flex;
    flex-direction: column;
  }
  .nav-header {
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: #1a1a1d;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-weight: 700;
    font-size: 16px;
  }
  #map { flex: 1; width: 100%; }
  .nav-info {
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: #1a1a1d;
    font-size: 13px;
    color: rgba(245,245,244,0.75);
  }
  .nav-info .dist { color: #4ade80; font-weight: 700; }
  .nav-route-line { animation: navDash 1s linear infinite; }
  @keyframes navDash { to { stroke-dashoffset: -18; } }
</style>
</head>
<body>
  <div class="nav-header" id="navHeader">실습실 위치</div>
  <div id="map"></div>
  <div class="nav-info" id="navInfo">위치 확인 중...</div>

<script>
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
  });

  const params = new URLSearchParams(location.search);
  const lat = parseFloat(params.get('lat'));
  const lng = parseFloat(params.get('lng'));
  const label = params.get('label') || '실습실';

  document.getElementById('navHeader').textContent = label;

  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  if (isNaN(lat) || isNaN(lng)) {
    document.getElementById('navInfo').textContent = '위치 정보가 올바르지 않습니다.';
  } else {
    const map = L.map('map').setView([lat, lng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        const me = [pos.coords.latitude, pos.coords.longitude];

        L.circleMarker(me, {
          radius: 8, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.9, weight: 2
        }).addTo(map).bindPopup('현재 위치');

        L.polyline([me, [lat, lng]], {
          color: '#4ade80', weight: 4, opacity: 0.9,
          dashArray: '8, 10', className: 'nav-route-line'
        }).addTo(map);

        map.fitBounds([me, [lat, lng]], { padding: [40, 40] });

        const dist = Math.round(haversineMeters(me[0], me[1], lat, lng));
        document.getElementById('navInfo').innerHTML = '직선거리 약 <span class="dist">' + dist + 'm</span> · 실제 도로 경로와는 다를 수 있어요';
      }, function() {
        document.getElementById('navInfo').textContent = '위치 접근이 거부되어 건물 위치만 표시합니다. 아이폰이면 설정 → 개인정보 보호 및 보안 → 위치 서비스 → Safari를 "앱을 사용하는 동안"으로 확인해보세요.';
      }, { enableHighAccuracy: true, timeout: 8000 });
    } else {
      document.getElementById('navInfo').textContent = '이 브라우저는 위치 확인을 지원하지 않습니다.';
    }
  }
</script>
</body>
</html>
