<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근로학생 시간표 제출</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1d21; --surface-pop: #272a30; --surface-deep: #202328; --surface-solid: #23262b;
  --text: #e9e7e2; --accent: #8ab4f8; --accent-soft: #b3cdfa; --accent-strong: #4f86d8; --on-accent: #10233d;
  --warn-text: #f3d98d; --ok-text: #b5e8c4; --danger-text: #f6b5ae; --muted-text: #c7ced3; --danger-line: #f28b82;
  --line-soft: rgba(255,255,255,.10);
  --t1: #e9e7e2; --t2: #cdcbc6; --t3: #a8a6a1; --t4: #84827e;
  --surface-1: #2a2d33; --surface-2: #30343b; --bd1: #3a3e45; --bd2: #4a4f57;
  --brand-solid: #3f78c8;
  --warn-bg: rgba(245,166,35,.16); --danger-bg: rgba(248,113,113,.16); --ok-bg: rgba(74,222,128,.14);
  --ok-strong: #4ade80; --warn-bd: rgba(245,166,35,.38); --danger-bd: rgba(248,113,113,.38); --ok-bd: rgba(74,222,128,.34);
  --sh: 0,0,0; --shk: 1;
  --w03:rgba(255,255,255,0.03); --w04:rgba(255,255,255,0.04); --w05:rgba(255,255,255,0.05);
  --w06:rgba(255,255,255,0.06); --w07:rgba(255,255,255,0.07); --w08:rgba(255,255,255,0.08);
  --w10:rgba(255,255,255,0.1); --w12:rgba(255,255,255,0.12); --w14:rgba(255,255,255,0.14);
  --w15:rgba(255,255,255,0.15); --w16:rgba(255,255,255,0.16); --w18:rgba(255,255,255,0.18);
  --w20:rgba(255,255,255,0.2); --w22:rgba(255,255,255,0.22); --w25:rgba(255,255,255,0.25);
  --w30:rgba(255,255,255,0.3); --w35:rgba(255,255,255,0.35); --w40:rgba(255,255,255,0.4);
  --w45:rgba(255,255,255,0.45); --w50:rgba(255,255,255,0.5); --w55:rgba(255,255,255,0.55);
  --w60:rgba(255,255,255,0.6); --w65:rgba(255,255,255,0.65); --w70:rgba(255,255,255,0.7);
  --w75:rgba(255,255,255,0.75); --w80:rgba(255,255,255,0.8); --w85:rgba(255,255,255,0.85); --w90:rgba(255,255,255,0.9);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f2; --surface-pop: #ffffff; --surface-deep: #ece9e3; --surface-solid: #ffffff;
  --text: #26282c; --accent: #1d5fae; --accent-soft: #2a6bb8; --accent-strong: #154a8c; --on-accent: #ffffff;
  --warn-text: #8a5a00; --ok-text: #1b6b3a; --danger-text: #a8322a; --muted-text: #5a6670; --danger-line: #c0392b;
  --line-soft: rgba(40,36,28,.10);
  --t1: #26282c; --t2: #3f4247; --t3: #5f6267; --t4: #8b8e93;
  --surface-1: #f4f2ed; --surface-2: #ebe8e1; --bd1: #e4e1da; --bd2: #d2cec5;
  --brand-solid: #1d5fae;
  --warn-bg: #fff4dc; --danger-bg: #fde8e6; --ok-bg: #e4f4e8;
  --ok-strong: #15803d; --warn-bd: #f0d28a; --danger-bd: #f0b9b4; --ok-bd: #a9d6b6;
  --sh: 60,50,30; --shk: .35;
  --w03:rgba(40,36,28,0.025); --w04:rgba(40,36,28,0.034); --w05:rgba(255,255,255,0.78);
  --w06:rgba(255,255,255,0.82); --w07:rgba(255,255,255,0.86); --w08:rgba(255,255,255,0.90);
  --w10:rgba(40,36,28,0.06); --w12:rgba(40,36,28,0.09); --w14:rgba(40,36,28,0.11);
  --w15:rgba(40,36,28,0.12); --w16:rgba(40,36,28,0.13); --w18:rgba(40,36,28,0.14);
  --w20:rgba(40,36,28,0.16); --w22:rgba(40,36,28,0.18); --w25:rgba(40,36,28,0.20);
  --w30:rgba(40,36,28,.24); --w35:rgba(38,40,44,0.46); --w40:rgba(38,40,44,0.52);
  --w45:rgba(38,40,44,0.56); --w50:rgba(38,40,44,0.60); --w55:rgba(38,40,44,0.64);
  --w60:rgba(38,40,44,0.68); --w65:rgba(38,40,44,0.72); --w70:rgba(38,40,44,0.76);
  --w75:rgba(38,40,44,0.80); --w80:rgba(38,40,44,0.85); --w85:rgba(38,40,44,0.88); --w90:rgba(38,40,44,0.92);
}
html { background: var(--bg); }
#labThemeBtn {
  position: fixed; left: 14px; bottom: 14px; z-index: 99999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--w22); background: var(--surface-pop); color: var(--text);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0;
  box-shadow: 0 2px 10px rgba(var(--sh), calc(.35 * var(--shk)));
  display: flex; align-items: center; justify-content: center;
  opacity: .85; transition: opacity .15s, transform .15s;
}
#labThemeBtn:hover { opacity: 1; transform: scale(1.06); }
@media print { #labThemeBtn { display: none !important; } }
</style>
<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '☀️' : '🌙';
      b.title = (m === 'dark') ? '화이트 테마로 전환' : '다크 테마로 전환';
      b.setAttribute('aria-label', b.title);
    }
  }
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text); }
  .card { background: var(--surface-solid); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 480px; width: 100%; padding: 36px 32px; }
  .logo { color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--t4); margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--t2); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 11px 14px; border: 1px solid var(--bd2); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border 0.15s; background: var(--surface-solid); color: var(--text); }
  input[type=text]:focus { border-color: var(--accent); }
  .upload-area { border: 2px dashed var(--bd2); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; transition: border 0.15s; position: relative; }
  .upload-area:hover, .upload-area.drag { border-color: var(--accent); background: var(--surface-2); }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--t2); }
  .upload-sub { font-size: 12px; color: var(--t4); margin-top: 4px; }
  input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .preview { margin-top: 16px; background: var(--surface-1); border-radius: 8px; padding: 14px 16px; }
  .preview-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .preview-table th { background: var(--brand-solid); color: #fff; padding: 6px 8px; text-align: left; }
  .preview-table td { padding: 5px 8px; border-bottom: 1px solid var(--bd1); color: var(--text); }
  .preview-table tr:last-child td { border-bottom: none; }
  .btn { width: 100%; padding: 14px; background: var(--brand-solid); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; transition: background 0.15s; }
  .btn:hover { background: var(--accent-strong); }
  .btn:disabled { background: #b0bec5; cursor: not-allowed; }
  .msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .msg.error { background: var(--danger-bg); color: var(--danger-text); }
  .msg.info { background: var(--surface-2); color: var(--accent); }
  .done { text-align: center; padding: 20px 0; }
  .done-icon { font-size: 56px; margin-bottom: 16px; }
  .done-title { font-size: 20px; font-weight: 700; color: var(--ok-text); margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: var(--t3); line-height: 1.6; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="logo">강원대학교 강릉캠퍼스</div>
  <h1>근로장학생 시간표 제출</h1>
  <div class="subtitle">컴퓨터실습실 점검 업무 배정을 위한 수업시간표 제출 페이지입니다.</div>

  <div id="msgArea"></div>

  <div id="formArea">
    <div class="field">
      <label>이름 *</label>
      <input type="text" id="studentName" placeholder="홍길동" tabindex="1">
    </div>
    <div class="field">
      <label>학번 *</label>
      <input type="text" id="studentId" placeholder="20251010" tabindex="2">
    </div>
    <div class="field">
      <label>수업시간표 파일 *</label>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📂</div>
        <div class="upload-text">학사시스템에서 받은 시간표 엑셀 파일을 선택하세요</div>
        <div class="upload-sub">.xls 또는 .xlsx 파일</div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" onchange="onFileChange(this)" tabindex="3">
      </div>
    </div>

    <div id="previewArea" style="display:none;"></div>

    <button class="btn" id="submitBtn" onclick="onSubmit()" disabled tabindex="4">제출하기</button>
  </div>

  <div id="doneArea" style="display:none;">
    <div class="done">
      <div class="done-icon">✅</div>
      <div class="done-title">제출이 완료되었습니다</div>
      <div class="done-sub">관리자가 확인 후 근무시간표를 배정하겠습니다.<br>이 창은 닫으셔도 됩니다.</div>
    </div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';

  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }
  // 파일(base64)처럼 큰 데이터는 쿼리스트링에 담을 수 없어 POST 본문으로 전송
  // (헤더를 지정하지 않으면 브라우저가 text/plain으로 보내 preflight 없이 GAS doPost가 받음)
  function apiPost(action, payload) {
    return fetch(GAS_URL + '?page=api&action=' + encodeURIComponent(action) + '&_=' + Date.now(), {
      method: 'POST',
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  const workerToken = new URLSearchParams(location.search).get('token') || '';
  let parsedClasses = [];
  let fileBase64 = '';
  let fileName = '';

  api({ action: 'workerverify', token: workerToken }).then(function(res) {
    if (!res || !res.valid) {
      showMsg('error', res ? res.message : '유효하지 않은 링크입니다.');
      document.getElementById('formArea').style.display = 'none';
    }
  }).catch(function() {
    showMsg('error', '링크 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
  });

  function showMsg(type, text) {
    document.getElementById('msgArea').innerHTML = '<div class="msg ' + type + '">' + escapeHtml(text) + '</div>';
  }
  function clearMsg() { document.getElementById('msgArea').innerHTML = ''; }
  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  const ua = document.getElementById('uploadArea');
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('drag'));
  ua.addEventListener('drop', e => {
    e.preventDefault(); ua.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) processFile(f);
  });

  function onFileChange(input) {
    const f = input.files && input.files[0];
    if (f) processFile(f);
  }

  function processFile(f) {
    if (!f.name.match(/\.(xls|xlsx)$/i)) { showMsg('error', '.xls 또는 .xlsx 파일만 업로드 가능합니다.'); return; }
    fileName = f.name;
    const reader = new FileReader();
    reader.onload = function() {
      fileBase64 = reader.result.split(',')[1];
      document.getElementById('previewArea').innerHTML =
        '<div class="preview"><div class="preview-title">⏳ 시간표 분석 중...</div></div>';
      document.getElementById('previewArea').style.display = 'block';
      document.getElementById('submitBtn').disabled = true;

      apiPost('workerparse', { token: workerToken, fileBase64: fileBase64, fileName: fileName }).then(function(res) {
        if (!res || !res.success) {
          showMsg('error', (res && res.message) || '파일을 인식하지 못했습니다. 학사시스템에서 받은 원본 파일인지 확인해주세요.');
          document.getElementById('previewArea').style.display = 'none';
          return;
        }
        parsedClasses = res.classes || [];
        if (res.studentName) document.getElementById('studentName').value = res.studentName;
        if (res.studentId) document.getElementById('studentId').value = res.studentId;
        renderPreview(res);
        document.getElementById('submitBtn').disabled = false;
        clearMsg();
      }).catch(function(err) {
        showMsg('error', '파일 분석 중 오류가 발생했습니다: ' + ((err && err.message) || ''));
        document.getElementById('previewArea').style.display = 'none';
      });
    };
    reader.readAsDataURL(f);
  }

  function renderPreview(res) {
    const el = document.getElementById('previewArea');
    if (!res.classes || res.classes.length === 0) {
      el.innerHTML = '<div class="preview"><div class="preview-title">✅ 파일 인식 완료</div><div style="font-size:13px;color:var(--t3);margin-top:4px;">등록된 수업이 없습니다.</div></div>';
      return;
    }
    let html = '<div class="preview"><div class="preview-title">✅ 인식된 수업 목록 (' + res.classes.length + '개) — 내 수업이 맞는지 확인해주세요</div>';
    html += '<table class="preview-table"><thead><tr><th>요일</th><th>시간</th><th>과목명</th></tr></thead><tbody>';
    const order = ['월','화','수','목','금','토','일'];
    const sorted = res.classes.slice().sort((a,b) => order.indexOf(a.day) - order.indexOf(b.day) || a.start.localeCompare(b.start));
    sorted.forEach(c => {
      html += '<tr><td>' + escapeHtml(c.day) + '</td><td>' + escapeHtml(c.start + '~' + c.end) + '</td><td>' + escapeHtml(c.subject) + '</td></tr>';
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  }

  function onSubmit() {
    const name = document.getElementById('studentName').value.trim();
    const id = document.getElementById('studentId').value.trim();
    if (!name) { showMsg('error', '이름을 입력해주세요.'); return; }
    if (!id) { showMsg('error', '학번을 입력해주세요.'); return; }
    if (!fileBase64) { showMsg('error', '시간표 파일을 업로드해주세요.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 제출 중...';

    apiPost('workersubmit', { token: workerToken, studentId: id, studentName: name, classes: parsedClasses }).then(function(res) {
      if (res && res.success) {
        document.getElementById('formArea').style.display = 'none';
        document.getElementById('msgArea').innerHTML = '';
        document.getElementById('doneArea').style.display = 'block';
      } else {
        showMsg('error', (res && res.message) || '제출에 실패했습니다. 다시 시도해주세요.');
        btn.disabled = false;
        btn.innerHTML = '제출하기';
      }
    }).catch(function(err) {
      showMsg('error', '서버 오류: ' + ((err && err.message) || '잠시 후 다시 시도해주세요.'));
      btn.disabled = false;
      btn.innerHTML = '제출하기';
    });
  }
</script>
</body>
</html>
