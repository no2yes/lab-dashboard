  <style>
  /* ====== 강원대학교 공식 색상 변수 (style.html) ====== */
  :root {
    --knu-primary: #003D7C;
    --knu-primary-dark: #002654;
    --knu-primary-light: #1A5490;
    --knu-primary-soft: rgba(0, 61, 124, 0.15);
    --knu-accent: #C5A572;
    --knu-accent-light: #E5D4B0;
    --knu-bg-tint: #E8EEF5;
    --knu-bg-soft: #f0f7fa;
    --knu-border-light: #b8d8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
  }
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--t4);
    padding: 16px 0;
  }
  .schedule-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .schedule-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--knu-primary);
  }
  .schedule-grid-wrapper {
    overflow-x: auto;
    background: var(--surface-solid);
    border: 1px solid var(--bd1);
    border-radius: 6px;
  }
  .schedule-loading {
    padding: 40px 20px;
    text-align: center;
    color: var(--knu-primary);
    font-size: 15px;
    font-weight: 600;
  }
  .schedule-loading .loading {
    display: inline-block;
    width: 22px; height: 22px;
    border: 3px solid var(--bd1);
    border-top-color: var(--knu-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .schedule-error { padding: 30px; text-align: center; color: var(--danger-line); font-size: 13px; }
  .schedule-grid { display: grid; min-width: 460px; }
  .grid-cell { border-right: 1px solid var(--bd1); border-bottom: 1px solid var(--bd1); font-size: 11px; padding: 4px; overflow: hidden; }
  .grid-cell:last-child { border-right: none; }
  .header-cell { background: var(--brand-solid); color: white; text-align: center; padding: 8px 4px; font-weight: 600; }
  .day-header.holiday-text .day-name, .day-header.holiday-text .day-date { color: var(--danger-line); }
  .day-header.today { background: #f5a623; }
  .day-name { font-size: 12px; }
  .day-date { font-size: 10px; opacity: 0.85; }
  .schedule-body { display: grid; grid-template-columns: 50px repeat(7, 1fr); min-width: 580px; }
  .now-line-wrap { position: relative; }
  .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--danger-line); box-shadow: 0 0 4px rgba(229,57,53,0.5); z-index: 20; pointer-events: none; }
  .now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; background: #e53935; border-radius: 50%; box-shadow: 0 0 3px rgba(229,57,53,0.6); }
  .now-line-label { position: absolute; right: 2px; top: -9px; background: #e53935; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; white-space: nowrap; z-index: 21; pointer-events: none; }
  .schedule-row { display: contents; }
  .time-cell { background: var(--surface-1); text-align: center; color: var(--t3); font-size: 11px; padding: 5px 2px; line-height: 1.2; min-height: 32px; }
  .empty-cell-readonly { background: var(--surface-solid); min-height: 32px; }
  .block-cell { padding: 4px 6px; font-size: 10px; overflow: hidden; line-height: 1.3; border-left: 3px solid; }
  .block-cell.regular { background: var(--danger-bg); color: var(--danger-text); border-left-color: var(--danger-line); }
  .block-cell.reserved.waiting { background: var(--warn-bg); color: var(--warn-text); border-left-color: #f5a623; }
  .block-cell.reserved.confirmed { background: var(--surface-2); color: var(--t2); border-left-color: #607d8b; }
  .block-time { font-weight: 600; font-size: 10px; }
  .block-label { font-size: 10px; margin-top: 2px; opacity: 0.9; }
  .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-box { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--bd2); }
  @media (max-width: 600px) { .schedule-grid, .schedule-body { min-width: 700px; } }
  /* 주 이동 네비게이션 (room.html 전용 보정) */
  .week-nav-btn { padding: 6px 12px; border: 1px solid var(--bd2); border-radius: 5px; background: var(--surface-solid); cursor: pointer; font-size: 12px; font-family: inherit; }
  .week-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .schedule-week-nav { display: flex; align-items: center; gap: 8px; }

  <script>
  (function () {
    var KEY = 'lab_theme', mode = 'dark';
    try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
    if (mode !== 'light' && mode !== 'dark') mode = 'dark';
    function apply(m) {
      mode = m;
      document.documentElement.setAttribute('data-theme', m);
      var b = document.getElementById('labThemeBtn');
      if (b) {
        b.textContent = (m === 'dark') ? '☀️' : '🌙';
        b.title = (m === 'dark') ? '화이트 테마로 전환' : '다크 테마로 전환';
        b.setAttribute('aria-label', b.title);
      }
    }
    var beforeMode = null;
    window.addEventListener('beforeprint', function () { beforeMode = mode; document.documentElement.setAttribute('data-theme', 'light'); });
    window.addEventListener('afterprint', function () { if (beforeMode) document.documentElement.setAttribute('data-theme', beforeMode); beforeMode = null; });
    window.toggleLabTheme = function () {
      var next = (mode === 'dark') ? 'light' : 'dark';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
    };
    apply(mode);
    function mount() {
      if (document.getElementById('labThemeBtn') || !document.body) return;
      var b = document.createElement('button');
      b.id = 'labThemeBtn'; b.type = 'button';
      b.onclick = window.toggleLabTheme;
      document.body.appendChild(b);
      apply(mode);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  })();
  </script>

<body>

<div class="room-container">
  <div id="roomContent">
    <div class="room-error">
      <div class="room-error-icon">⏳</div>
      <div>실습실 정보를 불러오는 중입니다...</div>
    </div>
  </div>
</div>

<script>
  // 정적 페이지(GitHub Pages)에서 직접 GAS JSON API를 호출 — google.script.run 대신 fetch 사용
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';
  const ROOM_ID = new URLSearchParams(location.search).get('id') || '';

  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }

  // 시간표 설정
  const SCHEDULE_CONFIG = {
    startHour: 9,
    endHour: 22,
    slotMinutes: 30
  };

  let currentWeekOffset = 0;  // 0=이번 주, 1=다음 주
  let currentRoom = null;
  let refreshTimer = null;

  window.addEventListener('load', () => {
    if (!ROOM_ID) {
      showError('실습실 ID가 지정되지 않았습니다.', '올바른 QR 코드를 사용해주세요.');
      return;
    }
    init();
  });

  function init() {
    // 실습실 정보 + 시간표 동시 로딩
    api({ action: 'roominfo', id: ROOM_ID })
      .then(res => {
        if (!res || !res.success || !res.room) {
          showError('실습실을 찾을 수 없습니다.', 'ID: ' + ROOM_ID);
          return;
        }
        onRoomInfoLoaded(res.room);
      })
      .catch(err => showError('정보 조회 실패', err.message || String(err)));
  }

  function onRoomInfoLoaded(room) {
    currentRoom = room;
    renderRoomHeader(room);
    loadSchedule();

    // 5분마다 자동 새로고침
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadSchedule, 5 * 60 * 1000);
  }

  function renderRoomHeader(room) {
    let swHtml = '';
    if (room.software && room.software.length > 0) {
      swHtml = '<div class="sw-mini"><div class="sw-mini-title">📦 설치 소프트웨어 (' + room.software.length + '개)</div><div class="sw-mini-list">';
      room.software.forEach(s => {
        const verText = s.version ? ' ' + s.version : '';
        swHtml += '<span class="sw-mini-item">' + escapeHtml(s.name + verText) + '</span>';
      });
      swHtml += '</div></div>';
    }

    document.getElementById('roomContent').innerHTML = `
      <div class="room-header">
        <h1>${escapeHtml(room.name)}</h1>
        <div class="subtitle">강원대학교 강릉캠퍼스 · ${escapeHtml(room.building || '')} · ${room.seats || 0}석</div>
        <a class="room-nav-link" href="https://no2yes.github.io/letsgokugc/outdoor-nav.html?dest=${encodeURIComponent(String(room.id || '').split('-')[0])}" target="_blank" rel="noopener">📍 이 실습실 가는 길</a>
      </div>

      <div class="room-meta">
        <div class="meta-item">
          <span class="meta-label">실습실ID:</span>
          <span class="meta-value">${escapeHtml(room.id)}</span>
        </div>
        ${room.pc ? `<div class="meta-item"><span class="meta-label">PC:</span><span class="meta-value">${escapeHtml(room.pc)}</span></div>` : ''}
        ${room.equipment ? `<div class="meta-item"><span class="meta-label">장비:</span><span class="meta-value">${escapeHtml(room.equipment)}</span></div>` : ''}
      </div>
      <div class="room-body">
        ${swHtml}

        <div class="now-time">현재 시각: <strong id="nowTime"></strong></div>

        <!-- 시간표 영역 -->
        <div class="schedule-header">
          <div class="schedule-title">📅 주간 시간표</div>
          <div class="schedule-week-nav">
            <button type="button" class="week-nav-btn" id="weekPrevBtn" onclick="weekPrev()"><span class="week-nav-btn-gauge reverse" id="weekPrevGauge"></span><span class="week-nav-btn-label">◀ 이전</span></button>
            <button type="button" class="week-nav-btn" id="weekTodayBtn" onclick="goToThisWeek()"><span class="week-nav-btn-gauge center" id="weekTodayGauge"></span><span class="week-nav-btn-label">이번주</span></button>
            <button type="button" class="week-nav-btn" id="weekNextBtn" onclick="weekNext()"><span class="week-nav-btn-gauge" id="weekNextGauge"></span><span class="week-nav-btn-label">다음 ▶</span></button>
          </div>
        </div>
        <div id="scheduleGrid" class="schedule-grid-wrapper">
          <div class="schedule-loading"><span class="loading"></span> 시간표 불러오는 중...</div>
        </div>
        <div class="legend" style="margin-top: 10px;">
          <div class="legend-item"><span class="legend-box" style="background:var(--w08);"></span> 빈 시간</div>
          <div class="legend-item"><span class="legend-box" style="background:rgba(248,113,113,0.22);border-color:var(--danger-line);"></span> 정규수업</div>
          <div class="legend-item"><span class="legend-box" style="background:rgba(245,166,35,0.22);border-color:#f5a623;"></span> 예약 대기</div>
          <div class="legend-item"><span class="legend-box" style="background:rgba(144,164,174,0.25);border-color:#90a4ae;"></span> 예약 확정</div>
        </div>

        <div class="refresh-info">
          <span class="refresh-dot"></span> 5분마다 자동 새로고침 · <span id="lastUpdate"></span>
        </div>

        <!-- 신청 CTA -->
        <div class="room-cta">
          <a href="javascript:goToRequest()" class="cta-btn">📝 이 실습실 사용 신청하기</a>
        </div>
      </div>

      <div class="footer">
        본 시스템은 강원대학교 강릉캠퍼스 자체 운영 시스템입니다.<br>
        관리: 강릉행정지원과 전산팀<br>
        <span style="opacity:0.6;">페이지 버전: 2610280031</span>
      </div>
    `;

    updateNowTime();
    setInterval(updateNowTime, 30000);  // 30초마다 현재 시각 갱신
  }

  function updateNowTime() {
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    const str = now.getFullYear() + '. ' + (now.getMonth()+1) + '. ' + now.getDate() + '. (' + days[now.getDay()] + ') ' +
                String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    const el = document.getElementById('nowTime');
    if (el) el.textContent = str;
  }

  function weekPrev() {
    if (currentWeekOffset > 0) { currentWeekOffset--; startGauge('weekPrevGauge'); loadSchedule(); }
  }
  function weekNext() {
    currentWeekOffset++; startGauge('weekNextGauge'); loadSchedule();
  }
  function goToThisWeek() {
    if (currentWeekOffset === 0) return;
    currentWeekOffset = 0;
    startGauge('weekTodayGauge');
    loadSchedule();
  }
  function updateWeekLabel() {
    const prevBtn = document.getElementById('weekPrevBtn');
    const todayBtn = document.getElementById('weekTodayBtn');
    if (prevBtn) prevBtn.disabled = (currentWeekOffset === 0);
    if (todayBtn) todayBtn.disabled = (currentWeekOffset === 0);
  }

  let activeGaugeId = null;
  function startGauge(id) {
    activeGaugeId = id;
    const el = document.getElementById(id);
    if (!el) return;
    if (el.classList.contains('center')) {
      el.style.transition = 'none';
      el.style.left = '50%';
      el.style.right = '50%';
      void el.offsetWidth;
      el.style.transition = 'left 1.5s ease-out, right 1.5s ease-out';
      el.style.left = '15%';
      el.style.right = '15%';
    } else {
      el.style.transition = 'none';
      el.style.width = '0%';
      void el.offsetWidth;
      el.style.transition = 'width 1.5s ease-out';
      el.style.width = '70%';
    }
  }
  function finishActiveGauge() {
    if (!activeGaugeId) return;
    const el = document.getElementById(activeGaugeId);
    activeGaugeId = null;
    if (!el) return;
    if (el.classList.contains('center')) {
      el.style.transition = 'left 0.15s ease-out, right 0.15s ease-out';
      el.style.left = '0%';
      el.style.right = '0%';
      setTimeout(function() {
        el.style.transition = 'none';
        el.style.left = '50%';
        el.style.right = '50%';
      }, 300);
    } else {
      el.style.transition = 'width 0.15s ease-out';
      el.style.width = '100%';
      setTimeout(function() {
        el.style.transition = 'none';
        el.style.width = '0%';
      }, 300);
    }
  }

  function loadSchedule() {
    updateWeekLabel();
    const monday = getMondayForOffset(currentWeekOffset);

    const gridEl = document.getElementById('scheduleGrid');
    const hasExistingGrid = gridEl.querySelector('.grid-cell, table') !== null;
    const oldOverlay = gridEl.querySelector('.schedule-loading-overlay');
    if (oldOverlay) oldOverlay.remove();
    if (hasExistingGrid) {
      const overlay = document.createElement('div');
      overlay.className = 'schedule-loading-overlay';
      overlay.innerHTML = '<div class="schedule-loading"><span class="loading"></span> 업데이트 중...</div>';
      gridEl.appendChild(overlay);
    } else {
      gridEl.innerHTML =
        '<div class="schedule-loading"><span class="loading"></span> 시간표 불러오는 중...</div>';
    }

    api({ action: 'roomschedule', id: ROOM_ID, week: monday })
      .then(function(res) {
        finishActiveGauge();
        onScheduleLoaded(res);
      })
      .catch(function(err) {
        finishActiveGauge();
        const ov = gridEl.querySelector('.schedule-loading-overlay');
        if (ov) ov.remove();
        gridEl.innerHTML =
          '<div class="schedule-error">조회 실패: ' + escapeHtml(err.message || String(err)) + '</div>';
      });
  }

  function getMondayForOffset(weekOffset) {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(today);
    monday.setDate(today.getDate() + diff + (weekOffset * 7));
    return monday.getFullYear() + '-' +
      String(monday.getMonth() + 1).padStart(2, '0') + '-' +
      String(monday.getDate()).padStart(2, '0');
  }

  function onScheduleLoaded(res) {
    if (!res.success) {
      document.getElementById('scheduleGrid').innerHTML =
        '<div class="schedule-error">' + escapeHtml(res.message) + '</div>';
      return;
    }
    renderSchedule(res.schedule);

    // 마지막 갱신 시각
    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      '갱신: ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }

  function renderSchedule(schedule) {
    const { startHour, endHour, slotMinutes } = SCHEDULE_CONFIG;
    const totalSlots = ((endHour - startHour) * 60) / slotMinutes;
    const _t = new Date();
    const todayStr = _t.getFullYear() + '-' +
      String(_t.getMonth() + 1).padStart(2, '0') + '-' +
      String(_t.getDate()).padStart(2, '0');

    // 받은 날짜 수(5일 또는 7일)에 맞춰 그리드 열 동적 설정
    const dayCount = schedule.length;
    const gridCols = '50px repeat(' + dayCount + ', 1fr)';
    const minW = (50 + dayCount * 76) + 'px';

    let html = '<div class="schedule-grid" style="grid-template-columns:' + gridCols + ';min-width:' + minW + ';">';
    html += '<div class="grid-cell header-cell time-col-header"></div>';
    schedule.forEach(day => {
      const isToday = day.date === todayStr;
      const dayLabel = day.dayOfWeek;
      const dayDate = day.date.slice(5).replace('-', '/');
      const holidayTextCls = day.isHoliday ? ' holiday-text' : '';
      html += `<div class="grid-cell header-cell day-header${isToday ? ' today' : ''}${holidayTextCls}">
        <div class="day-name">${dayLabel}</div>
        <div class="day-date">${dayDate}</div>
      </div>`;
    });
    html += '</div>';

    html += '<div class="schedule-body now-line-wrap" style="display:grid;grid-template-columns:' + gridCols + ';min-width:' + minW + ';">';
    for (let s = 0; s < totalSlots; s++) {
      const totalMin = startHour * 60 + s * slotMinutes;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      const timeLabel = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
      const showLabel = m === 0;

      html += '<div class="schedule-row">';
      html += `<div class="grid-cell time-cell">${showLabel ? timeLabel : ''}</div>`;

      schedule.forEach(day => {
        const block = findBlockAt(day.blocks, totalMin);
        if (block) {
          const blockStartMin = timeStrToMin(block.start);
          if (totalMin === blockStartMin) {
            const blockEndMin = timeStrToMin(block.end);
            const slotsCount = (blockEndMin - blockStartMin) / slotMinutes;
            const isRegular = block.type === '정규수업';
            let cssClass, labelText;
            if (isRegular) {
              cssClass = 'block-cell regular';
              labelText = block.label;
            } else {
              // 예약: 대기/확정 구분 + 둘 다 신청 불가 명시
              const isConfirmed = block.resStatus === '확정';
              cssClass = 'block-cell reserved' + (isConfirmed ? ' confirmed' : ' waiting');
              labelText = isConfirmed ? ('예약 확정' + (block.label ? ' · ' + block.label : '')) : '예약 대기';
            }
            html += `<div class="grid-cell ${cssClass}" style="grid-row: span ${slotsCount};">
              <div class="block-time">${block.start}~${block.end}</div>
              <div class="block-label">${escapeHtml(labelText)}</div>
            </div>`;
          }
        } else {
          html += '<div class="grid-cell empty-cell-readonly"></div>';
        }
      });

      html += '</div>';
    }
    html += '</div>';
    document.getElementById('scheduleGrid').innerHTML = html;
    drawNowLine(schedule, startHour, endHour, slotMinutes, totalSlots);
  }

  function drawNowLine(schedule, startHour, endHour, slotMinutes, totalSlots) {
    const wrap = document.querySelector('.now-line-wrap');
    if (!wrap) return;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const rangeStart = startHour * 60, rangeEnd = endHour * 60;
    // 오늘 날짜가 이 표에 포함되어 있고, 현재 시각이 표시 범위 안일 때만 그림
    const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    const todayInView = schedule.some(d => d.date === todayStr);
    if (!todayInView || nowMin < rangeStart || nowMin > rangeEnd) return;

    const rowHeight = wrap.scrollHeight / totalSlots;
    const topPx = ((nowMin - rangeStart) / slotMinutes) * rowHeight;
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = topPx + 'px';
    const label = document.createElement('div');
    label.className = 'now-line-label';
    label.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    line.appendChild(label);
    wrap.appendChild(line);
  }

  function timeStrToMin(t) {
    const parts = t.split(':');
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }

  function findBlockAt(blocks, totalMin) {
    for (const b of blocks) {
      const startMin = timeStrToMin(b.start);
      const endMin = timeStrToMin(b.end);
      if (totalMin >= startMin && totalMin < endMin) return b;
    }
    return null;
  }

  function goToRequest() {
    // 더 이상 iframe 안에서 돌지 않으므로(순수 정적 페이지), 바로 이동
    window.location.href = GAS_URL + '?room=' + encodeURIComponent(ROOM_ID);
  }

  function showError(title, msg) {
    document.getElementById('roomContent').innerHTML = `
      <div class="room-error">
        <div class="room-error-icon">⚠️</div>
        <h2 style="font-size:18px;color:var(--danger-text);margin-bottom:8px;">${escapeHtml(title)}</h2>
        <div style="color:var(--w60);font-size:13px;">${escapeHtml(msg)}</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
