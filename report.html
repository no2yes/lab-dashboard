<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고장·문제 신고</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1d21; --surface-pop: #272a30; --surface-deep: #202328; --surface-solid: #23262b;
  --text: #e9e7e2; --accent: #8ab4f8; --accent-soft: #b3cdfa; --accent-strong: #4f86d8; --on-accent: #10233d;
  --warn-text: #f3d98d; --ok-text: #b5e8c4; --danger-text: #f6b5ae; --muted-text: #c7ced3; --danger-line: #f28b82;
  --line-soft: rgba(255,255,255,.10);
  --t1: #e9e7e2; --t2: #cdcbc6; --t3: #a8a6a1; --t4: #84827e;
  --surface-1: #2a2d33; --surface-2: #30343b; --bd1: #3a3e45; --bd2: #4a4f57;
  --brand-solid: #3f78c8;
  --warn-bg: rgba(245,166,35,.16); --danger-bg: rgba(248,113,113,.16); --ok-bg: rgba(74,222,128,.14);
  --ok-strong: #4ade80; --warn-bd: rgba(245,166,35,.38); --danger-bd: rgba(248,113,113,.38); --ok-bd: rgba(74,222,128,.34);
  --sh: 0,0,0; --shk: 1;
  --w03:rgba(255,255,255,0.03); --w04:rgba(255,255,255,0.04); --w05:rgba(255,255,255,0.05);
  --w06:rgba(255,255,255,0.06); --w07:rgba(255,255,255,0.07); --w08:rgba(255,255,255,0.08);
  --w10:rgba(255,255,255,0.1); --w12:rgba(255,255,255,0.12); --w14:rgba(255,255,255,0.14);
  --w15:rgba(255,255,255,0.15); --w16:rgba(255,255,255,0.16); --w18:rgba(255,255,255,0.18);
  --w20:rgba(255,255,255,0.2); --w22:rgba(255,255,255,0.22); --w25:rgba(255,255,255,0.25);
  --w30:rgba(255,255,255,0.3); --w35:rgba(255,255,255,0.35); --w40:rgba(255,255,255,0.4);
  --w45:rgba(255,255,255,0.45); --w50:rgba(255,255,255,0.5); --w55:rgba(255,255,255,0.55);
  --w60:rgba(255,255,255,0.6); --w65:rgba(255,255,255,0.65); --w70:rgba(255,255,255,0.7);
  --w75:rgba(255,255,255,0.75); --w80:rgba(255,255,255,0.8); --w85:rgba(255,255,255,0.85); --w90:rgba(255,255,255,0.9);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f2; --surface-pop: #ffffff; --surface-deep: #ece9e3; --surface-solid: #ffffff;
  --text: #26282c; --accent: #1d5fae; --accent-soft: #2a6bb8; --accent-strong: #154a8c; --on-accent: #ffffff;
  --warn-text: #8a5a00; --ok-text: #1b6b3a; --danger-text: #a8322a; --muted-text: #5a6670; --danger-line: #c0392b;
  --line-soft: rgba(40,36,28,.10);
  --t1: #26282c; --t2: #3f4247; --t3: #5f6267; --t4: #8b8e93;
  --surface-1: #f4f2ed; --surface-2: #ebe8e1; --bd1: #e4e1da; --bd2: #d2cec5;
  --brand-solid: #1d5fae;
  --warn-bg: #fff4dc; --danger-bg: #fde8e6; --ok-bg: #e4f4e8;
  --ok-strong: #15803d; --warn-bd: #f0d28a; --danger-bd: #f0b9b4; --ok-bd: #a9d6b6;
  --sh: 60,50,30; --shk: .35;
  --w03:rgba(40,36,28,0.025); --w04:rgba(40,36,28,0.034); --w05:rgba(255,255,255,0.78);
  --w06:rgba(255,255,255,0.82); --w07:rgba(255,255,255,0.86); --w08:rgba(255,255,255,0.90);
  --w10:rgba(40,36,28,0.06); --w12:rgba(40,36,28,0.09); --w14:rgba(40,36,28,0.11);
  --w15:rgba(40,36,28,0.12); --w16:rgba(40,36,28,0.13); --w18:rgba(40,36,28,0.14);
  --w20:rgba(40,36,28,0.16); --w22:rgba(40,36,28,0.18); --w25:rgba(40,36,28,0.20);
  --w30:rgba(40,36,28,.24); --w35:rgba(38,40,44,0.46); --w40:rgba(38,40,44,0.52);
  --w45:rgba(38,40,44,0.56); --w50:rgba(38,40,44,0.60); --w55:rgba(38,40,44,0.64);
  --w60:rgba(38,40,44,0.68); --w65:rgba(38,40,44,0.72); --w70:rgba(38,40,44,0.76);
  --w75:rgba(38,40,44,0.80); --w80:rgba(38,40,44,0.85); --w85:rgba(38,40,44,0.88); --w90:rgba(38,40,44,0.92);
}
html { background: var(--bg); }
#labThemeBtn {
  position: fixed; left: 14px; bottom: 14px; z-index: 99999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--w22); background: var(--surface-pop); color: var(--text);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0;
  box-shadow: 0 2px 10px rgba(var(--sh), calc(.35 * var(--shk)));
  display: flex; align-items: center; justify-content: center;
  opacity: .85; transition: opacity .15s, transform .15s;
}
#labThemeBtn:hover { opacity: 1; transform: scale(1.06); }
@media print { #labThemeBtn { display: none !important; } }
</style>
<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '☀️' : '🌙';
      b.title = (m === 'dark') ? '화이트 테마로 전환' : '다크 테마로 전환';
      b.setAttribute('aria-label', b.title);
    }
  }
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic','맑은 고딕',sans-serif;
  background: var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  padding: 20px;
  color: var(--text);
}
.card {
  background: var(--w06);
  border: 1px solid var(--w14);
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(var(--sh),calc(0.25 * var(--shk)));
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 24px;
  color: var(--text);
}
.logo { color: var(--accent-soft); font-size: 13px; font-weight: 600; margin-bottom: 4px; }
h1 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.room-name { font-size: 15px; font-weight: 600; color: var(--accent-soft); margin-bottom: 16px; }
.desc { font-size: 13px; color: var(--w65); margin-bottom: 20px; line-height: 1.6; }
.msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
.msg.error { background: rgba(248,113,113,0.18); color: var(--danger-text); border: 1px solid rgba(248,113,113,0.4); }
textarea {
  width: 100%; padding: 12px;
  background: var(--w08);
  border: 1px solid var(--w22);
  border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical;
  color: var(--text);
}
textarea::placeholder { color: var(--w40); }
.char-count { text-align: right; font-size: 11px; color: var(--w40); margin-top: 4px; }
.btn { width: 100%; padding: 14px; background: #dc3545; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 16px; }
.btn:disabled { background: var(--w20); color: var(--w60); }
.done { text-align: center; padding: 30px 0; }
.done-icon { font-size: 56px; margin-bottom: 16px; }
.done-title { font-size: 20px; font-weight: 700; color: #6ee7a0; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: var(--w65); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid var(--w40); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.faq-title { font-size: 15px; font-weight: 700; color: var(--accent-soft); margin-bottom: 10px; padding-top: 20px; border-top: 1px solid var(--w15); }
.faq-skel-item {
  border: 1px solid var(--w14);
  border-radius: 8px;
  margin-bottom: 8px;
  padding: 14px;
}
.faq-skel-bar {
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--w08) 25%, var(--w18) 50%, var(--w08) 75%);
  background-size: 200% 100%;
  animation: faqSkelShimmer 1.4s ease-in-out infinite;
}
@keyframes faqSkelShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.faq-item { border: 1px solid var(--w14); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.faq-q { padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--w06); }
.faq-a { padding: 0 14px; max-height: 0; overflow: hidden; transition: all 0.2s; background: var(--w03); color: var(--w80); }
.faq-a.open { padding: 12px 14px; max-height: 1000px; }
.faq-a img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
.faq-arrow { transition: transform 0.2s; font-size: 12px; color: var(--w50); }
.faq-arrow.open { transform: rotate(180deg); }
</style>
</head>
<body>
<div class="card">
    <div class="logo">강원대학교 강릉캠퍼스</div>
    <h1>ℹ️ 실습실 안내 · 신고</h1>
    <div class="room-name">실습실: <span id="roomNameDisplay">확인 중...</span></div>
    <div class="desc">궁금한 점은 아래 FAQ에서 먼저 확인해 주세요.<br>실습실에 문제가 있으면 이름·연락처 없이 바로 신고할 수 있습니다.<br>접수처: 강릉행정지원과 전산팀</div>
  <div id="faqArea">
    <div class="faq-title" style="padding-top:0;border-top:none;">📖 자주 묻는 질문 (FAQ)</div>
    <div class="faq-skel-item"><div class="faq-skel-bar" style="width:70%;"></div></div>
    <div class="faq-skel-item"><div class="faq-skel-bar" style="width:55%;"></div></div>
    <div class="faq-skel-item"><div class="faq-skel-bar" style="width:62%;"></div></div>
  </div>
  <div id="reportFormArea">
    <div class="section-divider" style="border-top:1px solid var(--w15);padding-top:20px;margin-top:8px;">
      <div style="font-size:15px;font-weight:700;color:var(--danger-text);margin-bottom:10px;">🔧 고장·문제 신고</div>
    </div>
    <div id="msgArea"></div>
    <div id="bodyArea">
      <textarea id="content" rows="5" maxlength="500" placeholder="예: 3번 PC 모니터가 안 켜집니다 / 에어컨 소음이 심합니다" oninput="updateCount()"></textarea>
      <div class="char-count"><span id="charCount">0</span>/500</div>
      <div style="margin-top:12px;">
        <label style="font-size:12px;color:var(--w65);display:block;margin-bottom:4px;">처리 결과를 메일로 받고 싶으시면 입력해주세요 (선택)</label>
        <input type="email" id="feedbackEmail" placeholder="이메일 주소" style="width:100%;padding:10px 12px;background:var(--w08);border:1px solid var(--w22);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);box-sizing:border-box;">
      </div>
      <button class="btn" id="submitBtn" onclick="doSubmit()">신고 제출</button>
    </div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';

  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }

  const reportToken = new URLSearchParams(location.search).get('t') || '';
  let roomId = '';

  try {
    const cachedFaqH = localStorage.getItem('report_faq_h');
    if (cachedFaqH) document.getElementById('faqArea').style.minHeight = cachedFaqH + 'px';
  } catch (e) {}

  // 토큰 검증과 FAQ 조회를 동시에 시작 (병렬 실행으로 체감 속도 개선)
  api({ action: 'reportverify', t: reportToken })
    .then(function(res) {
      if (!res || !res.valid) {
        document.getElementById('roomNameDisplay').parentElement.style.display = 'none';
        showMsg('error', '유효하지 않은 링크입니다. QR을 다시 스캔해주세요.');
        document.getElementById('reportFormArea').style.display = 'none';
        return;
      }
      roomId = res.roomId;
      document.getElementById('roomNameDisplay').textContent = res.roomName;
    })
    .catch(function() {
      showMsg('error', '링크 확인 중 오류가 발생했습니다.');
    });

  loadFaqs();

  function loadFaqs() {
    api({ action: 'reportfaqs', t: reportToken })
      .then(function(res) {
        const faqArea = document.getElementById('faqArea');
        if (!res || !res.success || !res.items || res.items.length === 0) {
          faqArea.style.minHeight = '';
          faqArea.innerHTML = '';
          return;
        }
        let html = '<div class="faq-title" style="padding-top:0;border-top:none;">📖 자주 묻는 질문 (FAQ)</div>';
        res.items.forEach(function(f, i) {
          html += '<div class="faq-item">';
          html += '<div class="faq-q" onclick="toggleFaq(' + i + ')">' +
                  '<span>' + escapeHtml(f.question) + '</span>' +
                  '<span class="faq-arrow" id="faqArrow' + i + '">▼</span></div>';
          html += '<div class="faq-a" id="faqA' + i + '">' + escapeHtml(f.answer).replace(/\n/g, '<br>');
          if (f.imageUrl) html += '<br><img src="' + f.imageUrl + '" alt="FAQ 이미지">';
          html += '</div></div>';
        });
        faqArea.style.minHeight = '';
        faqArea.innerHTML = html;
        try { localStorage.setItem('report_faq_h', String(faqArea.scrollHeight)); } catch (e) {}
      })
      .catch(function() {
        const faqArea = document.getElementById('faqArea');
        faqArea.style.minHeight = '';
        faqArea.innerHTML = '';
      });
  }

  function toggleFaq(i) {
    const a = document.getElementById('faqA' + i);
    const arrow = document.getElementById('faqArrow' + i);
    const willOpen = !a.classList.contains('open');

    // 아코디언: 다른 열린 답변은 모두 닫기
    document.querySelectorAll('.faq-a.open').forEach(function(el) {
      if (el !== a) el.classList.remove('open');
    });
    document.querySelectorAll('.faq-arrow.open').forEach(function(el) {
      if (el !== arrow) el.classList.remove('open');
    });

    a.classList.toggle('open', willOpen);
    arrow.classList.toggle('open', willOpen);
  }

  // 브라우저 식별용 키 (localStorage에 저장, 없으면 새로 생성)
  function getClientKey() {
    try {
      let k = localStorage.getItem('report_client_key');
      if (!k) {
        k = 'c' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem('report_client_key', k);
      }
      return k;
    } catch (e) {
      return 'nokey_' + Math.random().toString(36).slice(2);
    }
  }

  function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function showMsg(type, text) { document.getElementById('msgArea').innerHTML = '<div class="msg ' + type + '">' + escapeHtml(text) + '</div>'; }
  function updateCount() {
    document.getElementById('charCount').textContent = document.getElementById('content').value.length;
  }

  function doSubmit() {
    const content = document.getElementById('content').value.trim();
    if (!content) { showMsg('error', '신고 내용을 입력해주세요.'); return; }
    if (!roomId) { showMsg('error', '실습실 정보를 확인할 수 없습니다. QR을 다시 스캔해주세요.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 제출 중...';

    api({
      action: 'reportsubmit', t: reportToken, content: content,
      clientKey: getClientKey(), email: document.getElementById('feedbackEmail').value.trim()
    })
      .then(function(res) {
        if (res && res.success) {
          document.getElementById('msgArea').innerHTML = '';
          document.getElementById('bodyArea').innerHTML =
            '<div class="done"><div class="done-icon">✅</div><div class="done-title">신고 완료</div><div class="done-sub">' + escapeHtml(res.message) + '</div></div>';
        } else {
          showMsg('error', (res && res.message) || '제출에 실패했습니다.');
          btn.disabled = false; btn.textContent = '신고 제출';
        }
      })
      .catch(function(err) {
        showMsg('error', '서버 오류: ' + (err.message || ''));
        btn.disabled = false; btn.textContent = '신고 제출';
      });
  }
</script>
</body>
</html>
