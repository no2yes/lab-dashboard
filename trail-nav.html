<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>등산로 네비 (임시)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background: #1b1d21; color: #e9e7e2; overflow: hidden; }
  #mapOuter { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; background: #1b1d21; }
  #mapRotate {
    position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax;
    margin-left: -100vmax; margin-top: -100vmax; transform-origin: 50% 50%;
    transition: transform 0.25s linear;
  }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: rgba(27,29,33,0.96); padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  select, button, input { font-family: inherit; font-size: 15px; border-radius: 8px; border: 1px solid #4a4f57; }
  select { flex: 1; padding: 10px 10px; background: #272a30; color: #e9e7e2; }
  button { padding: 10px 14px; background: #3f78c8; color: #fff; border: none; font-weight: 700; cursor: pointer; }
  button:active { background: #4f86d8; }
  button.secondary { background: #30343b; color: #cdcbc6; }
  button.small { font-size: 13px; padding: 8px 10px; }
  #status { font-size: 13px; color: #a8a6a1; line-height: 1.6; min-height: 18px; }
  #status b { color: #8ab4f8; }
  #tokenBar { position: absolute; top: 0; left: 0; right: 0; z-index: 1001; background: #23262b; padding: 10px 12px; display: flex; gap: 8px; }
  #tokenBar input { flex: 1; padding: 8px 10px; background: #1b1d21; color: #e9e7e2; }
  .hidden { display: none !important; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .badge.gps { background: #28a745; color: #fff; }
  .badge.nogps { background: #dc3545; color: #fff; }
  .badge.path { background: #ff9800; color: #1b1d21; }
  .badge.off { background: #5f6267; color: #fff; }
  #headingDot {
    position: absolute; top: 50%; left: 50%; z-index: 1000; pointer-events: none;
    transform: translate(-50%, -140%);
    font-size: 26px;
  }
  #verTag {
    position: absolute; top: 6px; right: 8px; z-index: 1000; pointer-events: none;
    font-size: 11px; color: #84827e; background: rgba(27,29,33,0.6); padding: 2px 7px; border-radius: 8px;
  }
</style>
</head>
<body>

<div id="tokenBar">
  <input type="text" id="tokenInput" placeholder="현황판 링크 또는 토큰을 붙여넣으세요">
  <button onclick="loadWithToken()">불러오기</button>
</div>

<div id="mapOuter">
  <div id="mapRotate"><div id="map"></div></div>
</div>
<div id="headingDot">🔼</div>
<div id="verTag">v1.0</div>

<div id="panel">
  <div class="row">
    <select id="destSelect">
      <option value="">목적지 선택...</option>
    </select>
    <button class="small secondary" id="rotateBtn" onclick="toggleCompass()">방향센서</button>
  </div>
  <div class="row">
    <button id="trackBtn" onclick="toggleTracking()" style="flex:1;">내 위치 추적 시작</button>
  </div>
  <div id="status">목적지를 선택하고 "내 위치 추적"을 켜줘. 조사된 길을 따라서만 안내하고, 조사된 길이 없으면 안내하지 않아.</div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';

  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }

  // 트레일/게이트 코드 → 이름 (Code.gs의 SURVEY_TRAILS / SURVEY_GATES 와 동일)
  const NAMES = {
    'N1':'정문',
    'G1':'사과대 방향 보행로 (정문 쪽)', 'G6':'사과대 방향 보행로 (기숙사 쪽)',
    'G2':'기숙사 출입로', 'G3':'치과병원 방향 출입로', 'G4':'공대 방향 보행로',
    'G5':'운동장 방향 보행로 (원룸촌 쪽)', 'G7':'운동장 방향 보행로 (도로 쪽)',
    'T1':'등산로입구(대학본부 주차장)', 'T2':'등산로입구(해람지)',
    'T3':'등산로출구(공대방향)', 'T4':'등산로출구(문성고방향)',
    'T5':'등산로출구(죽헌저수지 중간)', 'T6':'등산로출구(죽헌저수지 물막이)'
  };

  // 현재 위치가 조사된 길에서 이 거리 안이어야 "그 길 위에 있다"고 판단 (조사 지점 간격이 최대 300m라 여유를 둠)
  const ON_PATH_MAX_M = 150;
  const ARRIVED_MAX_M = 15;

  // 서버 압축 경로 문자열 디코딩 (Code.gs walkDecode_ 와 동일 로직)
  function walkDecode(s) {
    s = String(s || '');
    if (!/^-?\d+,-?\d+(,-?\d+)?(;-?\d+,-?\d+(,-?\d+)?)*$/.test(s)) return null;
    const parts = s.split(';');
    const f = parts[0].split(',');
    let la = parseInt(f[0], 10), ln = parseInt(f[1], 10);
    const hasAlt = f.length > 2;
    let alt = hasAlt ? parseInt(f[2], 10) : null;
    const out = [[la / 1e5, ln / 1e5, alt]];
    for (let i = 1; i < parts.length; i++) {
      const d = parts[i].split(',');
      la += parseInt(d[0], 10); ln += parseInt(d[1], 10);
      if (hasAlt) alt += parseInt(d[2], 10);
      out.push([la / 1e5, ln / 1e5, alt]);
    }
    return out;
  }

  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function bearing(lat1, lng1, lat2, lng2) {
    const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lng2-lng1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  function compass8(deg) {
    const dirs = ['북','북동','동','남동','남','남서','서','북서'];
    return dirs[Math.round(deg / 45) % 8];
  }
  function pathLength(pts) {
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += haversine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]);
    return s;
  }
  function segSum(pts, i0, i1) { // i0<=i1 구간의 누적 거리
    let s = 0;
    for (let i = i0; i < i1; i++) s += haversine(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
    return s;
  }

  let map, destCode = '', meMarker = null, watchId = null, destMarker = null;
  let edges = [], adjacency = {}, pathLinesLayer = null;
  let remainingLine = null, traveledLine = null, traveledTrace = [], connectorLine = null;
  let compassOn = false;

  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([37.7720, 128.8660], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(map);
    pathLinesLayer = L.layerGroup().addTo(map);
  }

  function extractToken(raw) {
    raw = (raw || '').trim();
    const m = raw.match(/[?&]t=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : raw;
  }

  function loadWithToken() {
    const t = extractToken(document.getElementById('tokenInput').value);
    if (!t) { setStatus('토큰 또는 현황판 링크를 입력해줘.'); return; }
    localStorage.setItem('trailnav_token', t);
    setStatus('불러오는 중...');
    api({ action: 'buildingcoords', t: t }).then(function(res) {
      if (!res || !res.success) {
        setStatus('불러오기 실패: ' + ((res && res.message) || '유효하지 않은 토큰'));
        return;
      }
      document.getElementById('tokenBar').classList.add('hidden');
      renderCoords(res.coords || {});
      buildGraph(res.paths || []);
      drawAllPaths();
      setStatus('지도를 불러왔어 (기록된 길 ' + edges.length + '개). 목적지를 선택해줘.');
    }).catch(function() {
      setStatus('서버 연결에 실패했어. 잠시 후 다시 시도해줘.');
    });
  }

  function renderCoords(coords) {
    const sel = document.getElementById('destSelect');
    const bounds = [];
    Object.keys(coords).forEach(function(code) {
      const ll = coords[code];
      if (!ll || ll.length < 2) return;
      bounds.push(ll);
      const name = NAMES[code] || code;
      const isTrail = /^T\d/.test(code);
      L.circleMarker(ll, {
        radius: 7, color: isTrail ? '#f3d98d' : '#8ab4f8', weight: 2,
        fillColor: isTrail ? '#f3d98d' : '#8ab4f8', fillOpacity: 0.85
      }).addTo(map).bindPopup(name + ' (' + code + ')');

      const opt = document.createElement('option');
      opt.value = code; opt.textContent = name + (isTrail ? ' [등산로]' : '');
      sel.appendChild(opt);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
    sel.setAttribute('data-coords', JSON.stringify(coords));
  }

  // 서버가 준 {from, to, path} 목록 → 그래프(노드=조사 코드, 엣지=기록된 길)로 변환
  // 조사된 길만 연결해서 다닐 수 있고, 지름길(직선) 연결은 절대 만들지 않음
  function buildGraph(rawEdges) {
    edges = rawEdges.map(function(e) {
      const pts = walkDecode(e && e.path);
      if (!pts || pts.length < 2) return null;
      const from = String((e && e.from) || '').trim().toUpperCase();
      const to = String((e && e.to) || '').trim().toUpperCase();
      return { from: from, to: to, pts: pts, length: pathLength(pts) };
    }).filter(Boolean);

    adjacency = {};
    edges.forEach(function(e, i) {
      if (e.from && e.from !== '-') {
        (adjacency[e.from] = adjacency[e.from] || []).push({ edgeIdx: i, node: e.to });
      }
      if (e.to && e.to !== '-') {
        (adjacency[e.to] = adjacency[e.to] || []).push({ edgeIdx: i, node: e.from });
      }
    });
  }

  function drawAllPaths() {
    pathLinesLayer.clearLayers();
    edges.forEach(function(e) {
      L.polyline(e.pts.map(function(p){ return [p[0], p[1]]; }), { color: '#b5e8c4', weight: 4, opacity: 0.55 }).addTo(pathLinesLayer);
    });
  }

  function clearRouteLines() {
    if (remainingLine) { map.removeLayer(remainingLine); remainingLine = null; }
    if (traveledLine) { map.removeLayer(traveledLine); traveledLine = null; }
    if (connectorLine) { map.removeLayer(connectorLine); connectorLine = null; }
    traveledTrace = [];
  }

  document.getElementById('destSelect').addEventListener('change', function() {
    const code = this.value;
    const coords = JSON.parse(this.getAttribute('data-coords') || '{}');
    if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
    clearRouteLines();
    destCode = code;
    if (!code) return;
    const ll = coords[code];
    if (ll) {
      destMarker = L.circleMarker(ll, { radius: 9, color: '#f6b5ae', weight: 3, fillColor: '#dc3545', fillOpacity: 0.9 })
        .addTo(map).bindPopup('목적지: ' + (NAMES[code] || code)).openPopup();
      map.panTo(ll);
    }
    if (!adjacency[code]) {
      setStatus('목적지: <b>' + (NAMES[code] || code) + '</b><br>이 목적지로 연결된 조사된 길이 아직 없어 — 안내할 수 없어.');
    } else {
      setStatus('목적지: <b>' + (NAMES[code] || code) + '</b> — "내 위치 추적"을 눌러줘. 조사된 길을 따라서만 안내할게.');
    }
  });

  // 점 하나를 선분(a-b) 위로 투영 (평면근사 — 짧은 거리라 충분히 정확함)
  function projectOnSegment(lat, lng, aLat, aLng, bLat, bLng) {
    const latRef = (aLat + bLat) / 2;
    const mLat = 111320, mLng = 111320 * Math.cos(latRef * Math.PI / 180);
    const ax = 0, ay = 0;
    const bx = (bLng - aLng) * mLng, by = (bLat - aLat) * mLat;
    const px = (lng - aLng) * mLng, py = (lat - aLat) * mLat;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const pLat = aLat + t * (bLat - aLat), pLng = aLng + t * (bLng - aLng);
    return { lat: pLat, lng: pLng, t: t, dist: haversine(lat, lng, pLat, pLng) };
  }

  // 현재 위치에서 가장 가까운 "조사된 길 위의 지점"을 선분 투영으로 찾음 (꼭짓점 사이 중간에 있어도 정확하게 그 길 위로 스냅)
  function nearestPointOnNetwork(lat, lng) {
    let best = null;
    edges.forEach(function(e, ei) {
      for (let vi = 0; vi < e.pts.length - 1; vi++) {
        const a = e.pts[vi], b = e.pts[vi + 1];
        const proj = projectOnSegment(lat, lng, a[0], a[1], b[0], b[1]);
        if (!best || proj.dist < best.dist) {
          best = { edgeIdx: ei, segIdx: vi, t: proj.t, lat: proj.lat, lng: proj.lng, dist: proj.dist };
        }
      }
    });
    return best;
  }

  // 그래프(노드=조사 코드)에서 다익스트라로 가장 짧은 "조사된 길들의 조합"을 찾음 — 직선 지름길은 절대 쓰지 않음
  function shortestNodePath(seeds, target) {
    const dist = {}, prev = {}, prevEdge = {}, visited = {};
    const pq = seeds.map(function(s){ return { node: s.node, cost: s.cost }; });
    seeds.forEach(function(s) {
      if (dist[s.node] === undefined || s.cost < dist[s.node]) dist[s.node] = s.cost;
    });
    while (pq.length) {
      let bi = 0;
      for (let i = 1; i < pq.length; i++) if (pq[i].cost < pq[bi].cost) bi = i;
      const cur = pq.splice(bi, 1)[0];
      if (visited[cur.node]) continue;
      if (dist[cur.node] !== undefined && cur.cost > dist[cur.node] + 1e-6) continue;
      visited[cur.node] = true;
      if (cur.node === target) break;
      (adjacency[cur.node] || []).forEach(function(adj) {
        const nd = cur.cost + edges[adj.edgeIdx].length;
        if (dist[adj.node] === undefined || nd < dist[adj.node]) {
          dist[adj.node] = nd;
          prev[adj.node] = cur.node;
          prevEdge[adj.node] = adj.edgeIdx;
          pq.push({ node: adj.node, cost: nd });
        }
      });
    }
    if (dist[target] === undefined) return null;
    const seq = [];
    let node = target;
    while (prev[node] !== undefined) {
      seq.unshift({ edgeIdx: prevEdge[node], from: prev[node], to: node });
      node = prev[node];
    }
    return { startNode: node, seq: seq, total: dist[target] };
  }

  // 현재 위치 → 목적지까지, 조사된 길만 이어서 만든 전체 좌표 목록을 매번 새로 계산 (갈림길에서 다른 조사된 길을 타면 자동으로 다시 계산됨)
  // loc은 nearestPointOnNetwork()의 결과(없으면 새로 계산) — 마커 스냅과 같은 지점을 재사용해서 일관되게 보이도록 함
  // 산책로 조사구간(입구·출구) 밖으로 벗어났을 때도 포기하지 않고, 가장 가까운 조사구간까지는
  // 짧은 직선(연결선, 점선으로 구분)으로 돌아가는 것으로 보고, 그 다음부터는 조사된 길만 따라 최단거리로 안내
  function computeRoute(lat, lng, dest, loc) {
    if (!edges.length) return { noData: true };
    if (loc === undefined) loc = nearestPointOnNetwork(lat, lng);
    if (!loc) return { noRoute: true };
    const offNetwork = loc.dist > ON_PATH_MAX_M;

    const e = edges[loc.edgeIdx];
    const a = e.pts[loc.segIdx], b = e.pts[loc.segIdx + 1];
    const toLL = function(p){ return [p[0], p[1]]; };
    const costToFrom = segSum(e.pts, 0, loc.segIdx) + haversine(loc.lat, loc.lng, a[0], a[1]);
    const costToTo = haversine(loc.lat, loc.lng, b[0], b[1]) + segSum(e.pts, loc.segIdx + 1, e.pts.length - 1);
    const seeds = [];
    if (e.from) seeds.push({ node: e.from, cost: costToFrom });
    if (e.to) seeds.push({ node: e.to, cost: costToTo });
    if (!seeds.length) return { noRoute: true };

    const result = shortestNodePath(seeds, dest);
    if (!result) return { noRoute: true };

    let points;
    if (result.startNode === e.to) {
      points = [[loc.lat, loc.lng]].concat(e.pts.slice(loc.segIdx + 1).map(toLL));
    } else {
      points = [[loc.lat, loc.lng]].concat(e.pts.slice(0, loc.segIdx + 1).map(toLL).reverse());
    }
    result.seq.forEach(function(step) {
      const edge = edges[step.edgeIdx];
      const forward = (step.from === edge.from);
      const segPts = (forward ? edge.pts : edge.pts.slice().reverse()).map(toLL);
      points = points.concat(segPts.slice(1));
    });

    let connector = null, total = result.total;
    if (offNetwork) {
      connector = [[lat, lng], [loc.lat, loc.lng]];
      total += loc.dist;
    }
    return { points: points, connector: connector, total: total, offNetwork: offNetwork };
  }

  function toggleTracking() {
    const btn = document.getElementById('trackBtn');
    if (watchId) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      btn.textContent = '내 위치 추적 시작';
      btn.classList.remove('secondary');
      return;
    }
    if (!navigator.geolocation) { setStatus('이 브라우저는 위치추적을 지원하지 않아.'); return; }
    btn.textContent = '추적 중지';
    btn.classList.add('secondary');
    watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {
      enableHighAccuracy: true, maximumAge: 2000, timeout: 15000
    });
  }

  function onPosition(pos) {
    const rawLat = pos.coords.latitude, rawLng = pos.coords.longitude, acc = pos.coords.accuracy;

    // 길 근처에 있으면 GPS 오차로 튀지 않도록 위치를 그 길 위로 스냅해서 표시 (지도가 과도하게 움직이는 것 방지)
    const loc = (edges.length ? nearestPointOnNetwork(rawLat, rawLng) : null);
    const onNetwork = !!(loc && loc.dist <= ON_PATH_MAX_M);
    const lat = onNetwork ? loc.lat : rawLat;
    const lng = onNetwork ? loc.lng : rawLng;

    if (!meMarker) {
      meMarker = L.circleMarker([lat, lng], { radius: 8, color: '#f6b5ae', weight: 2, fillColor: '#f6b5ae', fillOpacity: 0.9 }).addTo(map);
    } else {
      meMarker.setLatLng([lat, lng]);
    }
    map.panTo([lat, lng]);

    // 지나온 흔적 (흐리게) — 스냅된 위치 기준으로 쌓아서 흔적도 길을 따라 깔끔하게 그려짐
    traveledTrace.push([lat, lng]);
    if (traveledTrace.length >= 2) {
      if (!traveledLine) traveledLine = L.polyline(traveledTrace, { color: '#dc3545', weight: 6, opacity: 0.28 }).addTo(map);
      else traveledLine.setLatLngs(traveledTrace);
    }

    if (!destCode) {
      setStatus('현재 위치 추적 중 <span class="badge gps">GPS ±' + Math.round(acc) + 'm</span> — 목적지를 선택해줘.');
      return;
    }

    const destName = NAMES[destCode] || destCode;
    const route = computeRoute(rawLat, rawLng, destCode, loc || undefined);

    if (route.points) {
      if (!remainingLine) remainingLine = L.polyline(route.points, { color: '#dc3545', weight: 6, opacity: 0.95 }).addTo(map);
      else remainingLine.setLatLngs(route.points);

      if (route.connector) {
        if (!connectorLine) connectorLine = L.polyline(route.connector, { color: '#ff9800', weight: 5, opacity: 0.9, dashArray: '2 10' }).addTo(map);
        else connectorLine.setLatLngs(route.connector);
      } else if (connectorLine) {
        map.removeLayer(connectorLine); connectorLine = null;
      }

      if (route.total <= ARRIVED_MAX_M) {
        setStatus('<b>' + destName + '</b> 도착! 🎉 <span class="badge gps">GPS ±' + Math.round(acc) + 'm</span>');
      } else {
        const nextPoint = route.offNetwork ? [loc.lat, loc.lng] : route.points[Math.min(1, route.points.length - 1)];
        const b = bearing(lat, lng, nextPoint[0], nextPoint[1]);
        const badge = route.offNetwork
          ? '<span class="badge off">조사구간 복귀 중</span>'
          : '<span class="badge path">조사된 길</span>';
        setStatus('<b>' + destName + '</b> ' + badge + ' 남은 거리 약 <b>' + Math.round(route.total) + 'm</b>, 다음 방향: <b>' + compass8(b) + '</b> ' +
          '<span class="badge gps">GPS ±' + Math.round(acc) + 'm</span>');
      }
    } else {
      if (remainingLine) { map.removeLayer(remainingLine); remainingLine = null; }
      if (connectorLine) { map.removeLayer(connectorLine); connectorLine = null; }
      if (route.noData) {
        setStatus('<span class="badge off">기록된 길 없음</span> 이 토큰에는 조사된 길 데이터가 없어.');
      } else {
        setStatus('<span class="badge off">경로 없음</span> 지금 위치에서 <b>' + destName + '</b> 까지 이어지는 조사된 길 조합을 찾지 못했어. 조사된 길로 이동해줘.');
      }
    }
  }

  function onPosError(err) {
    setStatus('위치를 가져오지 못했어: ' + (err.message || '') + ' <span class="badge nogps">GPS 실패</span>');
  }

  // ====== 걷는 방향이 위로 오도록 지도 회전 (나침반) ======
  // "직전 방향 유지 후 한번에 보정"하면 그 보정 순간에 지도가 툭 튀어서 잔상처럼 흔들려 보임.
  // 대신 최근 N개 값의 평균(원형 평균 — 0도/360도 경계를 정확히 다루기 위해 sin/cos으로 평균)을
  // 매번 새로 내서 적용하기 때문에, 한두 개의 튄 값은 평균에 묻혀 티가 안 나고, 흔들림 없이 부드럽게 따라감.
  let headingBuffer = [];
  const HEADING_WINDOW = 15; // 평균에 포함할 최근 샘플 수 (클수록 더 부드럽지만 반응은 느려짐)

  function circularMeanHeading(samples) {
    let sx = 0, sy = 0;
    samples.forEach(function(d) {
      const r = d * Math.PI / 180;
      sx += Math.cos(r); sy += Math.sin(r);
    });
    let m = Math.atan2(sy, sx) * 180 / Math.PI;
    if (m < 0) m += 360;
    return m;
  }

  function applyRotation(headingDeg) {
    document.getElementById('mapRotate').style.transform = 'rotate(' + (-headingDeg) + 'deg)';
  }

  function onOrientation(e) {
    let heading = null, accuracy = null;
    if (typeof e.webkitCompassHeading === 'number') {
      heading = e.webkitCompassHeading; // iOS Safari: 0=북, 시계방향 증가 (바로 사용 가능)
      if (typeof e.webkitCompassAccuracy === 'number') accuracy = e.webkitCompassAccuracy; // -1 = 신호 무효
    } else if (typeof e.alpha === 'number') {
      heading = (360 - e.alpha) % 360; // Android 등: 근사치
    }
    if (heading === null || isNaN(heading)) return;
    if (accuracy !== null && accuracy < 0) return; // 완전히 무효한 값은 평균에도 섞지 않음

    headingBuffer.push(heading);
    if (headingBuffer.length > HEADING_WINDOW) headingBuffer.shift();
    applyRotation(circularMeanHeading(headingBuffer));
  }

  function toggleCompass() {
    const btn = document.getElementById('rotateBtn');
    if (compassOn) {
      window.removeEventListener('deviceorientation', onOrientation);
      compassOn = false;
      headingBuffer = [];
      btn.classList.remove('secondary');
      btn.textContent = '방향센서';
      applyRotation(0);
      return;
    }
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      // iOS 13+: 반드시 사용자 탭 안에서 호출해야 함
      DOE.requestPermission().then(function(state) {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', onOrientation);
          compassOn = true;
          btn.classList.add('secondary');
          btn.textContent = '회전 끄기';
        } else {
          setStatus('방향센서 권한이 거부됐어. 설정에서 허용해줘야 지도가 회전돼.');
        }
      }).catch(function() {
        setStatus('방향센서를 사용할 수 없어 (iOS 권한 요청 실패).');
      });
    } else if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', onOrientation);
      compassOn = true;
      btn.classList.add('secondary');
      btn.textContent = '회전 끄기';
    } else {
      setStatus('이 기기/브라우저는 방향센서를 지원하지 않아.');
    }
  }

  function setStatus(html) {
    document.getElementById('status').innerHTML = html;
  }

  initMap();
  // 쿼리스트링(?t=) 또는 이전에 썼던 토큰을 자동으로 채워줌
  const qsToken = new URLSearchParams(location.search).get('t');
  const savedToken = (function(){ try { return localStorage.getItem('trailnav_token'); } catch(e){ return null; } })();
  if (qsToken || savedToken) {
    document.getElementById('tokenInput').value = qsToken || savedToken;
    loadWithToken();
  }
</script>
</body>
</html>
