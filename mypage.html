<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 신청 조회 · 취소</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1d21; --surface-pop: #272a30; --surface-deep: #202328; --surface-solid: #23262b;
  --text: #e9e7e2; --accent: #8ab4f8; --accent-soft: #b3cdfa; --accent-strong: #4f86d8; --on-accent: #10233d;
  --warn-text: #f3d98d; --ok-text: #b5e8c4; --danger-text: #f6b5ae; --muted-text: #c7ced3; --danger-line: #f28b82;
  --line-soft: rgba(255,255,255,.10);
  --t1: #e9e7e2; --t2: #cdcbc6; --t3: #a8a6a1; --t4: #84827e;
  --surface-1: #2a2d33; --surface-2: #30343b; --bd1: #3a3e45; --bd2: #4a4f57;
  --brand-solid: #3f78c8;
  --warn-bg: rgba(245,166,35,.16); --danger-bg: rgba(248,113,113,.16); --ok-bg: rgba(74,222,128,.14);
  --ok-strong: #4ade80; --warn-bd: rgba(245,166,35,.38); --danger-bd: rgba(248,113,113,.38); --ok-bd: rgba(74,222,128,.34);
  --sh: 0,0,0; --shk: 1;
  --knu-primary: #8ab4f8; --knu-primary-dark: #4f86d8; --knu-primary-light: #b3cdfa;
  --knu-primary-soft: rgba(138,180,248,.25); --knu-bg-tint: rgba(255,255,255,.06); --knu-bg-soft: rgba(255,255,255,.08);
  --knu-border-light: rgba(255,255,255,.18);
  --w03:rgba(255,255,255,0.03); --w04:rgba(255,255,255,0.04); --w05:rgba(255,255,255,0.05);
  --w06:rgba(255,255,255,0.06); --w07:rgba(255,255,255,0.07); --w08:rgba(255,255,255,0.08);
  --w10:rgba(255,255,255,0.1); --w12:rgba(255,255,255,0.12); --w14:rgba(255,255,255,0.14);
  --w15:rgba(255,255,255,0.15); --w16:rgba(255,255,255,0.16); --w18:rgba(255,255,255,0.18);
  --w20:rgba(255,255,255,0.2); --w22:rgba(255,255,255,0.22); --w25:rgba(255,255,255,0.25);
  --w30:rgba(255,255,255,0.3); --w35:rgba(255,255,255,0.35); --w40:rgba(255,255,255,0.4);
  --w45:rgba(255,255,255,0.45); --w50:rgba(255,255,255,0.5); --w55:rgba(255,255,255,0.55);
  --w60:rgba(255,255,255,0.6); --w65:rgba(255,255,255,0.65); --w70:rgba(255,255,255,0.7);
  --w75:rgba(255,255,255,0.75); --w80:rgba(255,255,255,0.8); --w85:rgba(255,255,255,0.85); --w90:rgba(255,255,255,0.9);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f2; --surface-pop: #ffffff; --surface-deep: #ece9e3; --surface-solid: #ffffff;
  --text: #26282c; --accent: #1d5fae; --accent-soft: #2a6bb8; --accent-strong: #154a8c; --on-accent: #ffffff;
  --warn-text: #8a5a00; --ok-text: #1b6b3a; --danger-text: #a8322a; --muted-text: #5a6670; --danger-line: #c0392b;
  --line-soft: rgba(40,36,28,.10);
  --t1: #26282c; --t2: #3f4247; --t3: #5f6267; --t4: #8b8e93;
  --surface-1: #f4f2ed; --surface-2: #ebe8e1; --bd1: #e4e1da; --bd2: #d2cec5;
  --brand-solid: #1d5fae;
  --warn-bg: #fff4dc; --danger-bg: #fde8e6; --ok-bg: #e4f4e8;
  --ok-strong: #15803d; --warn-bd: #f0d28a; --danger-bd: #f0b9b4; --ok-bd: #a9d6b6;
  --sh: 60,50,30; --shk: .35;
  --knu-primary: #1d5fae; --knu-primary-dark: #154a8c; --knu-primary-light: #2a6bb8;
  --knu-primary-soft: rgba(29,95,174,.18); --knu-bg-tint: #edeae4; --knu-bg-soft: #f1efe9; --knu-border-light: #dcd8d0;
  --w03:rgba(40,36,28,0.025); --w04:rgba(40,36,28,0.034); --w05:rgba(255,255,255,0.78);
  --w06:rgba(255,255,255,0.82); --w07:rgba(255,255,255,0.86); --w08:rgba(255,255,255,0.90);
  --w10:rgba(40,36,28,0.06); --w12:rgba(40,36,28,0.09); --w14:rgba(40,36,28,0.11);
  --w15:rgba(40,36,28,0.12); --w16:rgba(40,36,28,0.13); --w18:rgba(40,36,28,0.14);
  --w20:rgba(40,36,28,0.16); --w22:rgba(40,36,28,0.18); --w25:rgba(40,36,28,0.20);
  --w30:rgba(40,36,28,.24); --w35:rgba(38,40,44,0.46); --w40:rgba(38,40,44,0.52);
  --w45:rgba(38,40,44,0.56); --w50:rgba(38,40,44,0.60); --w55:rgba(38,40,44,0.64);
  --w60:rgba(38,40,44,0.68); --w65:rgba(38,40,44,0.72); --w70:rgba(38,40,44,0.76);
  --w75:rgba(38,40,44,0.80); --w80:rgba(38,40,44,0.85); --w85:rgba(38,40,44,0.88); --w90:rgba(38,40,44,0.92);
}
html { background: var(--bg); }
#labThemeBtn {
  position: fixed; left: 14px; bottom: 14px; z-index: 99999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--w22); background: var(--surface-pop); color: var(--text);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0;
  box-shadow: 0 2px 10px rgba(var(--sh), calc(.35 * var(--shk)));
  display: flex; align-items: center; justify-content: center;
  opacity: .85; transition: opacity .15s, transform .15s;
}
#labThemeBtn:hover { opacity: 1; transform: scale(1.06); }
@media print { #labThemeBtn { display: none !important; } }
</style>
<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '☀️' : '🌙';
      b.title = (m === 'dark') ? '화이트 테마로 전환' : '다크 테마로 전환';
      b.setAttribute('aria-label', b.title);
    }
  }
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.5; padding: 16px; background: var(--bg); background-attachment: fixed; color: var(--text); }
.container { max-width: 720px; margin: 0 auto; }
.header { padding: 20px 4px 14px; border-bottom: 1px solid var(--w15); }
.header h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.header .subtitle { font-size: 12px; opacity: 0.7; }
.card { background: var(--w05); border: 1px solid var(--w12); border-radius: 12px; padding: 18px 20px; margin: 16px 0; }
.section { margin-bottom: 18px; }
.section:last-child { margin-bottom: 0; }
.section-title { font-size: 14px; font-weight: 700; padding-bottom: 8px; margin-bottom: 14px; border-bottom: 2px solid var(--w15); }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 14px; }
.msg-info { background: rgba(127,179,255,0.1); border: 1px solid rgba(127,179,255,0.3); color: var(--w80); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--w85); }
.required { color: var(--danger-line); }
input {
  width: 100%; padding: 10px 12px; border-radius: 7px; font-size: 14px; font-family: inherit;
  background: var(--w08); border: 1px solid var(--w22); color: var(--text);
}
input::placeholder { color: var(--w40); }
input:focus { outline: none; border-color: var(--knu-primary); box-shadow: 0 0 0 2px var(--knu-primary-soft); }
.btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.btn:disabled { cursor: not-allowed; background: var(--w25); color: var(--w60); }
.btn-primary { background: var(--knu-primary); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--knu-primary-dark); color: #fff; }
.btn .loading { display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:-2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.req-card { border: 1px solid var(--w14); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: var(--w05); }
.req-card.canceled, .req-card.rejected { opacity: 0.6; }
.req-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.req-id { font-size: 12px; color: var(--w45); font-family: monospace; }
.req-room { font-size: 15px; font-weight: 700; color: var(--knu-primary-light); }
.req-line { font-size: 14px; color: var(--w85); margin-top: 4px; }
.req-purpose { font-size: 13px; color: var(--w60); margin-top: 4px; }
.status-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status-badge.pending { background: rgba(245,166,35,0.22); color: var(--warn-text); }
.status-badge.approved { background: rgba(74,222,128,0.2); color: var(--ok-text); }
.status-badge.rejected { background: rgba(248,113,113,0.22); color: var(--danger-text); }
.status-badge.canceled { background: rgba(144,164,174,0.25); color: var(--muted-text); }
.req-cancel-btn { margin-top: 10px; padding: 7px 14px; border: 1px solid var(--danger-line); border-radius: 6px; background: var(--w05); color: var(--danger-text); cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }
.req-cancel-btn:hover { background: #dc3545; color: #fff; }
.lookup-empty { text-align: center; color: var(--w50); padding: 24px; font-size: 14px; }
.footer { text-align: center; font-size: 11px; padding: 16px 0; color: var(--w50); }
.result-modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
.result-modal.show { display: flex; }
.result-box { border-radius: 14px; padding: 28px 24px; text-align: center; max-width: 340px; width: 100%; background: var(--surface-pop); color: var(--text); }
.result-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 24px; font-weight: 700; }
.result-icon.success { background: var(--ok-bg); color: var(--ok-strong); }
.result-icon.error { background: var(--danger-bg); color: var(--danger-line); }
.result-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.result-title.error { color: var(--danger-text); }
.result-content { white-space: pre-line; font-size: 13px; border-radius: 8px; padding: 10px 12px; margin-bottom: 18px; background: var(--w06); color: var(--w85); }
.result-btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.result-btn.success { background: var(--ok-strong); color: #0d2b16; }
.result-btn.error { background: var(--danger-line); color: #fff; }
</style>
</head>
<body>

<div class="result-modal" id="resultModal">
  <div class="result-box">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-content" id="resultContent"></div>
    <button class="result-btn" id="resultBtn" onclick="closeResultModal()">확인</button>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>내 신청 조회 · 취소</h1>
    <div class="subtitle">강원대학교 강릉캠퍼스 컴퓨터실습실</div>
  </div>

  <div class="card">
    <div class="section">
      <div class="section-title">신청 조회</div>
      <div class="msg msg-info">
        신청 시 받으신 <strong>신청번호</strong>와 <strong>이메일</strong>을 입력하면 본인 신청 내역을 확인하고 취소할 수 있습니다.
      </div>
      <div class="field">
        <label>신청번호 <span class="required">*</span></label>
        <input type="text" id="lookupReqId" placeholder="예: REQ-260529-001">
      </div>
      <div class="field">
        <label>이메일 <span class="required">*</span></label>
        <input type="email" id="lookupEmail" placeholder="신청 시 입력한 이메일">
      </div>
      <button class="btn btn-primary" id="lookupBtn" onclick="doLookup()">조회하기</button>
    </div>

    <div class="section" id="resultSection" style="display:none;">
      <div class="section-title">내 신청 목록</div>
      <div id="resultArea"></div>
    </div>
  </div>

  <div class="footer">
    본 시스템은 강원대학교 강릉캠퍼스 자체 운영 시스템입니다.<br>
    관리: 강릉행정지원과 전산팀<br>
    <span style="opacity:0.6;">페이지 버전: 2610272249</span>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';

  function api(params) {
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    return fetch(GAS_URL + '?page=api&' + q + '&_=' + Date.now()).then(r => r.json());
  }

  let roomMap = {};
  let lookupEmail = '';

  const qs = new URLSearchParams(location.search);
  const PREFILL_ID = qs.get('id') || '';
  const PREFILL_EMAIL = qs.get('email') || '';

  window.addEventListener('load', () => {
    api({ action: 'rooms' }).then(res => {
      ((res && res.rooms) || []).forEach(r => { roomMap[r.id] = r.name; });
    });

    if (PREFILL_ID) document.getElementById('lookupReqId').value = PREFILL_ID;
    if (PREFILL_EMAIL) document.getElementById('lookupEmail').value = PREFILL_EMAIL;
    if (PREFILL_ID && PREFILL_EMAIL) {
      doLookup();
    }
  });

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function statusClass(status) {
    if (status === '대기') return 'pending';
    if (status === '승인') return 'approved';
    if (status === '반려') return 'rejected';
    if (status === '취소') return 'canceled';
    return 'pending';
  }

  function getDowLabel(dateStr) {
    const dows = ['일','월','화','수','목','금','토'];
    const d = new Date(dateStr + 'T00:00:00');
    return dows[d.getDay()];
  }

  function doLookup() {
    const reqId = document.getElementById('lookupReqId').value.trim();
    const email = document.getElementById('lookupEmail').value.trim();
    if (!reqId || !email) {
      showResultModal('error', '입력 확인', '신청번호와 이메일을 모두 입력해주세요.');
      return;
    }

    const btn = document.getElementById('lookupBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span>조회 중...';

    api({ action: 'mypage_lookup', reqId: reqId, email: email })
      .then(function(res) {
        btn.disabled = false;
        btn.textContent = '조회하기';
        if (!res.success) {
          showResultModal('error', '조회 실패', res.message);
          document.getElementById('resultSection').style.display = 'none';
          return;
        }
        lookupEmail = res.email;
        renderResults(res.requests);
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = '조회하기';
        showResultModal('error', '서버 오류', err.message || String(err));
      });
  }

  let selectedCancelIds = new Set();

  function renderResults(requests) {
    const section = document.getElementById('resultSection');
    const area = document.getElementById('resultArea');
    section.style.display = 'block';
    selectedCancelIds = new Set();

    if (!requests || requests.length === 0) {
      area.innerHTML = '<div class="lookup-empty">신청 내역이 없습니다.</div>';
      return;
    }

    const cancelableIds = requests.filter(r => r.cancelable).map(r => r.id);

    let html = '';
    if (cancelableIds.length > 1) {
      html += '<div id="bulkCancelBar" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--w08);border-radius:8px;margin-bottom:10px;">' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--w85);cursor:pointer;">' +
          '<input type="checkbox" id="selectAllCancel" onchange="toggleSelectAllCancel(this.checked)"> 취소 가능한 신청 전체선택' +
        '</label>' +
        '<button id="bulkCancelBtn" class="req-cancel-btn" style="width:auto;padding:6px 14px;opacity:0.4;pointer-events:none;" onclick="doCancelSelected()">선택 취소 (<span id="bulkCancelCount">0</span>건)</button>' +
      '</div>';
    }

    requests.forEach(r => {
      const cls = statusClass(r.status);
      const roomName = roomMap[r.roomId] || r.roomId;
      const dow = getDowLabel(r.useDate);
      html += '<div class="req-card ' + cls + '">';
      html += '<div class="req-card-head">';
      if (r.cancelable) {
        html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">' +
          '<input type="checkbox" class="cancel-select-cb" data-id="' + escapeHtml(r.id) + '" onchange="onCancelCbChange()">' +
          '<span class="req-id">' + escapeHtml(r.id) + '</span></label>';
      } else {
        html += '<span class="req-id">' + escapeHtml(r.id) + '</span>';
      }
      html += '<span class="status-badge ' + cls + '">' + escapeHtml(r.status) + '</span>';
      html += '</div>';
      html += '<div class="req-room">' + escapeHtml(roomName) + ' (' + escapeHtml(r.roomId) + ')</div>';
      html += '<div class="req-line">' + r.useDate + ' (' + dow + ') &nbsp; ' + r.startTime + ' ~ ' + r.endTime + ' &nbsp;·&nbsp; ' + escapeHtml(r.requestType) + '</div>';
      if (r.purpose) html += '<div class="req-purpose">목적: ' + escapeHtml(r.purpose) + '</div>';
      if (r.cancelable) {
        html += '<button class="req-cancel-btn" onclick="doCancel(\'' + escapeHtml(r.id) + '\')">신청 취소</button>';
      }
      html += '</div>';
    });
    area.innerHTML = html;
  }

  function toggleSelectAllCancel(checked) {
    document.querySelectorAll('.cancel-select-cb').forEach(cb => { cb.checked = checked; });
    onCancelCbChange();
  }

  function onCancelCbChange() {
    selectedCancelIds = new Set(
      Array.from(document.querySelectorAll('.cancel-select-cb:checked')).map(cb => cb.getAttribute('data-id'))
    );
    const btn = document.getElementById('bulkCancelBtn');
    const countEl = document.getElementById('bulkCancelCount');
    if (!btn) return;
    countEl.textContent = selectedCancelIds.size;
    if (selectedCancelIds.size > 0) {
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    } else {
      btn.style.opacity = '0.4';
      btn.style.pointerEvents = 'none';
    }
    const all = document.querySelectorAll('.cancel-select-cb');
    const allChecked = all.length > 0 && Array.from(all).every(cb => cb.checked);
    const selectAllCb = document.getElementById('selectAllCancel');
    if (selectAllCb) selectAllCb.checked = allChecked;
  }

  function doCancelSelected() {
    if (selectedCancelIds.size === 0) return;
    const ids = Array.from(selectedCancelIds);
    if (!confirm('선택한 ' + ids.length + '건의 신청을 취소하시겠습니까?\n\n취소하면 해당 시간이 다시 신청 가능 상태가 됩니다.')) return;

    api({ action: 'mypage_bulkcancel', reqIds: ids.join(','), email: lookupEmail })
      .then(function(res) {
        if (res.success) {
          showResultModal('success', '취소 처리 완료', res.message);
          const reqId2 = document.getElementById('lookupReqId').value.trim();
          api({ action: 'mypage_lookup', reqId: reqId2, email: lookupEmail }).then(function(r2) {
            if (r2.success) renderResults(r2.requests);
          });
        } else {
          showResultModal('error', '취소 실패', res.message);
        }
      })
      .catch(function(err) {
        showResultModal('error', '서버 오류', err.message || String(err));
      });
  }

  function doCancel(reqId) {
    if (!confirm('이 신청을 취소하시겠습니까?\n신청번호: ' + reqId + '\n\n취소하면 해당 시간이 다시 신청 가능 상태가 됩니다.')) return;

    api({ action: 'mypage_cancel', reqId: reqId, email: lookupEmail })
      .then(function(res) {
        if (res.success) {
          showResultModal('success', '취소 완료', res.message);
          const reqId2 = document.getElementById('lookupReqId').value.trim();
          api({ action: 'mypage_lookup', reqId: reqId2, email: lookupEmail }).then(function(r2) {
            if (r2.success) renderResults(r2.requests);
          });
        } else {
          showResultModal('error', '취소 실패', res.message);
        }
      })
      .catch(function(err) {
        showResultModal('error', '서버 오류', err.message || String(err));
      });
  }

  function showResultModal(type, title, message) {
    const modal = document.getElementById('resultModal');
    const icon = document.getElementById('resultIcon');
    const titleEl = document.getElementById('resultTitle');
    const content = document.getElementById('resultContent');
    const btn = document.getElementById('resultBtn');
    icon.className = 'result-icon ' + type;
    titleEl.className = 'result-title ' + type;
    btn.className = 'result-btn ' + type;
    icon.textContent = type === 'success' ? '✓' : '!';
    titleEl.textContent = title;
    content.textContent = message;
    btn.textContent = '확인';
    modal.classList.add('show');
  }

  function closeResultModal() {
    document.getElementById('resultModal').classList.remove('show');
  }
</script>
</body>
</html>
