<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컴퓨터실습실 현황판</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  html { scrollbar-color: var(--w25) var(--w04); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--w03); }
  ::-webkit-scrollbar-thumb { background: var(--w22); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--w35); background-clip: padding-box; }
  body {
    font-family: 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background: var(--bg);
    background-repeat: no-repeat;
    color:var(--text);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--w15);
  }
  .title { font-size: 18px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  .title .sub { font-size: 11px; font-weight: 400; opacity: 0.6; }
  .clock { text-align: right; }
  .clock .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock .date { font-size: 11px; opacity: 0.65; margin-top: 2px; }
  .clock .weather { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 10px;
    flex: 1;
    align-content: start;
  }

  .room-card {
    background: var(--w07);
    border: 1px solid var(--w12);
    border-radius: 12px;
    padding: 12px 50px 10px 12px;
    backdrop-filter: blur(4px);
    position: relative;
    overflow: hidden;
  }
  .room-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .room-card.available { background: rgba(34,197,94,0.14); border-color: rgba(74,222,128,0.35); }
  .room-card.available::before { background: #4ade80; }
  .room-card.in_use { background: rgba(248,113,113,0.10); border-color: rgba(248,113,113,0.28); }
  .room-card.in_use::before { background: var(--danger-line); }
  .room-card.before_open { background: rgba(251,191,36,0.10); border-color: rgba(251,191,36,0.28); }
  .room-card.before_open::before { background: #fbbf24; }
  .room-card.closed { background: var(--w03); border-color: var(--line-soft); opacity: 0.55; }
  .room-card.closed::before { background: var(--w25); }

  .room-name { margin: 6px -38px 10px 0; color:var(--text); }
  .building-line {
    display: inline-block; max-width: 100%;
    font-size: 11px; font-weight: 700; color: var(--w75);
    background: var(--w10); border-radius: 10px; padding: 1px 9px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top;
  }
  /* 호실 번호: 카드에서 가장 크고 굵게, 상태 색으로 한눈에 */
  .room-num-line {
    font-size: 34px; font-weight: 900; line-height: 1.05; letter-spacing: -0.5px;
    margin-top: 6px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .room-num-line.long { font-size: 27px; }
  .room-num-line .ho { font-size: 15px; font-weight: 800; margin-left: 2px; letter-spacing: 0; opacity: 0.85; }
  .room-card.available .room-num-line { color: var(--ok-strong); }
  .room-card.in_use .room-num-line { color: var(--danger-line); }
  .room-card.before_open .room-num-line { color: var(--warn-text); }
  .room-card.closed .room-num-line { color: var(--t4); }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .badge.available { background: rgba(74,222,128,0.22); color: var(--ok-text); }
  .badge.in_use { background: rgba(248,113,113,0.2); color: var(--danger-text); }
  .badge.before_open { background: rgba(251,191,36,0.2); color: var(--warn-text); }
  .badge.closed { background: var(--w10); color: var(--w60); }

  .room-meta { font-size: 11px; color: var(--w75); line-height: 1.6; }
  .room-meta .pc { font-size: 15px; font-weight: 800; color:var(--text); }
  .room-meta .pc-unit { font-size: 11px; font-weight: 600; opacity: 0.7; }

  .loading, .error { text-align: center; padding: 60px 20px; color: var(--w65); font-size: 14px; grid-column: 1 / -1; }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    position: relative;
  }
  .filter-bar-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--w40);
    letter-spacing: 0.3px;
    white-space: nowrap;
    margin-right: 2px;
  }
  @keyframes filterAttractPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    50% { box-shadow: 0 0 0 5px rgba(74,222,128,0.25); }
  }
  .filter-bar.attract .filter-toggle,
  .filter-bar.attract .dropdown-btn {
    animation: filterAttractPulse 1.6s ease-in-out 3;
  }
  .filter-chip {
    background: var(--w08);
    border: 1px solid var(--w18);
    color: var(--w85);
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-chip.active { background: #4ade80; border-color: #4ade80; color: #063c1a; }
  .dropdown-wrap { position: relative; }
  .dropdown-btn {
    background: var(--w08);
    border: 1px solid var(--w18);
    color: var(--w85);
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .dropdown-btn.active { background: #4ade80; border-color: #4ade80; color: #063c1a; }
  .dropdown-btn .arrow { font-size: 9px; opacity: 0.7; }
  .dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 150px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface-pop);
    border: 1px solid var(--w18);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(var(--sh),calc(0.4 * var(--shk)));
    z-index: 50;
  }
  .dropdown-panel.show { display: block; }
  .dropdown-item {
    padding: 7px 10px;
    font-size: 12px;
    color: var(--w85);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--w08); }
  .dropdown-item.selected { background: rgba(74,222,128,0.2); color: var(--ok-text); font-weight: 700; }
  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
    background: var(--w08);
    border: 1px solid var(--w18);
    border-radius: 20px;
    padding: 5px 13px;
  }
  .filter-toggle.active { background: rgba(74,222,128,0.2); border-color: #4ade80; }
  .filter-toggle:hover, .dropdown-btn:hover {
    border-color: var(--w40);
    background: var(--w14);
  }
  .filter-toggle.active:hover { border-color: #4ade80; background: rgba(74,222,128,0.28); }
  .filter-switch {
    display: inline-block;
    width: 26px;
    height: 14px;
    border-radius: 10px;
    background: var(--w30);
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .filter-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--surface-solid);
    transition: transform 0.2s;
  }
  .filter-toggle.active .filter-switch { background: #4ade80; }
  .filter-toggle.active .filter-switch::after { transform: translateX(12px); }

  .common-sw-bar {
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--w05);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
    font-size: 11px;
  }
  .common-sw-bar .lbl { opacity: 0.6; white-space: nowrap; }
  .common-sw-bar .sw-tag { background: var(--w14); }

  .filter-tip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    background: var(--brand-solid);
    border: 1px solid rgba(74,222,128,0.5);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    padding: 9px 14px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(var(--sh),calc(0.35 * var(--shk)));
    white-space: nowrap;
    z-index: 40;
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
  }
  .filter-tip.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .filter-tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 20px;
    border: 6px solid transparent;
    border-top-color: var(--brand-solid);
  }
  .filter-tip .tip-close {
    margin-left: 10px;
    opacity: 0.6;
    cursor: pointer;
    font-weight: 700;
  }
  @media (max-width: 480px) {
    .filter-tip { white-space: normal; max-width: 260px; }
  }


  .fav-section-title {
    font-size: 12px;
    font-weight: 800;
    margin: 0 0 8px;
    opacity: 0.9;
  }

  .fav-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    opacity: 0.4;
    line-height: 1;
    padding: 2px;
  }
  .fav-btn.active { opacity: 1; }

  .nav-btn {
    position: absolute;
    top: 8px; right: 28px;
    background: none;
    border: none;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
    opacity: 0.55;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 1; }

  .nav-modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .nav-modal-overlay.open { display: flex; }
  .nav-modal {
    background: #1a1a1d;
    border-radius: 16px;
    width: min(480px, 100%);
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(var(--sh),calc(0.5 * var(--shk)));
  }
  .nav-modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    color: #f5f5f4;
  }
  .nav-modal-head .name { font-weight: 700; font-size: 15px; }
  .nav-modal-close {
    background: none; border: none; color: inherit;
    font-size: 20px; cursor: pointer; opacity: 0.7; line-height: 1; padding: 4px;
  }
  .nav-modal-close:hover { opacity: 1; }
  #navMapContainer { width: 100%; height: 320px; }
  .nav-modal-info {
    padding: 10px 16px 14px;
    font-size: 13px;
    color: rgba(245,245,244,0.7);
  }
  .nav-modal-info .dist { color: var(--ok-strong); font-weight: 700; }
  .nav-route-line { animation: navDash 1s linear infinite; }
  @keyframes navDash { to { stroke-dashoffset: -18; } }

  /* ===== 제목 아이콘(PC+QR) — 누르면 폰 접속 QR, PC(마우스) 화면에서만 클릭 가능 ===== */
  .title-icon-btn {
    background: none;
    border: none;
    padding: 2px;
    margin: 0;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    color:var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s, transform 0.15s;
  }
  .title-icon-btn:hover { color: var(--ok-strong); background: rgba(74,222,128,0.14); transform: translateY(-1px); }
  @media (pointer: coarse) {
    .title-icon-btn { pointer-events: none; }
  }

  .qr-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,8,10,0.72);
    backdrop-filter: blur(3px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .qr-modal-overlay.open { display: flex; }
  .qr-modal {
    background: var(--surface-solid);
    color: #111827;
    width: min(420px, 100%);
    border-radius: 24px;
    padding: 32px 28px 26px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(var(--sh),calc(0.45 * var(--shk)));
    animation: qrPopIn 0.22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes qrPopIn {
    from { transform: scale(0.92) translateY(8px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .qr-modal-icon { font-size: 28px; margin-bottom: 6px; }
  .qr-modal-desc { font-size: 15px; color: #374151; line-height: 1.5; margin-bottom: 18px; }
  .qr-modal-desc b { color: #059669; }
  .qr-modal-box {
    display: inline-flex;
    padding: 16px;
    background: var(--surface-solid);
    border: 2px solid #d1fae5;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(5,150,105,0.12);
    margin-bottom: 16px;
  }
  .qr-modal-box svg { display: block; width: 200px; height: 200px; }
  .qr-modal-timer { font-size: 12px; color: #9ca3af; margin-bottom: 20px; }
  .qr-modal-close {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    padding: 13px;
    border-radius: 14px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .qr-modal-close:hover { filter: brightness(1.08); }

  .sw-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .sw-tag {
    font-size: 9.5px;
    background: var(--w12);
    color: var(--w85);
    padding: 1px 6px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; opacity: 0.85; display: flex; align-items: center; gap: 6px; }
  .close-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .close-card {
    background: var(--w05);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .close-card.exception { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); }
  .close-card .cname { font-size: 11px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .close-card .ctime { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .close-card.exception .ctime { color: var(--warn-text); }
  .close-card .ctime.off { opacity: 0.4; font-weight: 600; font-size: 11px; }

  .footer { text-align: center; margin-top: 10px; font-size: 10px; opacity: 0.4; }
  .footer-link { color: inherit; text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }
</style>
<style id="labThemeCss">
/* ====== 공통 테마 (다크 = 차콜 / 라이트 = 따뜻한 오프화이트) ======
   각 화면의 head 안에서 include('theme') 한 줄로 불러옵니다.
   색을 바꾸고 싶으면 이 파일의 변수만 고치면 전체 화면에 반영됩니다. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1d21;
  --surface-pop: #272a30;      /* 팝업·모달 바탕 */
  --surface-deep: #202328;     /* 모달 헤더 등 한 단계 어두운 면 */
  --surface-solid: #23262b;    /* 불투명 카드 바탕 */
  --text: #e9e7e2;
  --accent: #8ab4f8;
  --accent-soft: #b3cdfa;
  --accent-strong: #4f86d8;
  --on-accent: #10233d;
  --warn-text: #f3d98d;
  --ok-text: #b5e8c4;
  --danger-text: #f6b5ae;
  --muted-text: #c7ced3;
  --danger-line: #f28b82;
  --line-soft: rgba(255,255,255,.10);
  --t1: #e9e7e2; --t2: #cdcbc6; --t3: #a8a6a1; --t4: #84827e;
  --surface-1: #2a2d33; --surface-2: #30343b;
  --bd1: #3a3e45; --bd2: #4a4f57;
  --brand-solid: #3f78c8;
  --warn-bg: rgba(245,166,35,.16); --danger-bg: rgba(248,113,113,.16); --ok-bg: rgba(74,222,128,.14);
  --ok-strong: #4ade80;
  --warn-bd: rgba(245,166,35,.38); --danger-bd: rgba(248,113,113,.38); --ok-bd: rgba(74,222,128,.34);
  --sh: 0,0,0;
  --shk: 1;
  --knu-primary: #8ab4f8;
  --knu-primary-dark: #4f86d8;
  --knu-primary-light: #b3cdfa;
  --knu-primary-soft: rgba(138,180,248,.25);
  --knu-bg-tint: rgba(255,255,255,.06);
  --knu-bg-soft: rgba(255,255,255,.08);
  --knu-border-light: rgba(255,255,255,.18);
  --w03:rgba(255,255,255,0.03);
  --w04:rgba(255,255,255,0.04);
  --w05:rgba(255,255,255,0.05);
  --w06:rgba(255,255,255,0.06);
  --w07:rgba(255,255,255,0.07);
  --w08:rgba(255,255,255,0.08);
  --w10:rgba(255,255,255,0.1);
  --w12:rgba(255,255,255,0.12);
  --w14:rgba(255,255,255,0.14);
  --w15:rgba(255,255,255,0.15);
  --w16:rgba(255,255,255,0.16);
  --w18:rgba(255,255,255,0.18);
  --w20:rgba(255,255,255,0.2);
  --w22:rgba(255,255,255,0.22);
  --w25:rgba(255,255,255,0.25);
  --w30:rgba(255,255,255,0.3);
  --w35:rgba(255,255,255,0.35);
  --w40:rgba(255,255,255,0.4);
  --w45:rgba(255,255,255,0.45);
  --w50:rgba(255,255,255,0.5);
  --w55:rgba(255,255,255,0.55);
  --w60:rgba(255,255,255,0.6);
  --w65:rgba(255,255,255,0.65);
  --w70:rgba(255,255,255,0.7);
  --w75:rgba(255,255,255,0.75);
  --w80:rgba(255,255,255,0.8);
  --w85:rgba(255,255,255,0.85);
  --w90:rgba(255,255,255,0.9);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f2;
  --surface-pop: #ffffff;
  --surface-deep: #ece9e3;
  --surface-solid: #ffffff;
  --text: #26282c;
  --accent: #1d5fae;
  --accent-soft: #2a6bb8;
  --accent-strong: #154a8c;
  --on-accent: #ffffff;
  --warn-text: #8a5a00;
  --ok-text: #1b6b3a;
  --danger-text: #a8322a;
  --muted-text: #5a6670;
  --danger-line: #c0392b;
  --line-soft: rgba(40,36,28,.10);
  --t1: #26282c; --t2: #3f4247; --t3: #5f6267; --t4: #8b8e93;
  --surface-1: #f4f2ed; --surface-2: #ebe8e1;
  --bd1: #e4e1da; --bd2: #d2cec5;
  --brand-solid: #1d5fae;
  --warn-bg: #fff4dc; --danger-bg: #fde8e6; --ok-bg: #e4f4e8;
  --ok-strong: #15803d;
  --warn-bd: #f0d28a; --danger-bd: #f0b9b4; --ok-bd: #a9d6b6;
  --sh: 60,50,30;
  --shk: .35;
  --knu-primary: #1d5fae;
  --knu-primary-dark: #154a8c;
  --knu-primary-light: #2a6bb8;
  --knu-primary-soft: rgba(29,95,174,.18);
  --knu-bg-tint: #edeae4;
  --knu-bg-soft: #f1efe9;

<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '\u2600\uFE0F' : '\uD83C\uDF19';
      b.title = (m === 'dark') ? '\uD654\uC774\uD2B8 \uD14C\uB9C8\uB85C \uC804\uD658' : '\uB2E4\uD06C \uD14C\uB9C8\uB85C \uC804\uD658';
      b.setAttribute('aria-label', b.title);
    }
  }
  // 인쇄할 때는 항상 밝은 테마로 (잉크·가독성)
  var beforeMode = null;
  window.addEventListener('beforeprint', function () { beforeMode = mode; document.documentElement.setAttribute('data-theme', 'light'); });
  window.addEventListener('afterprint', function () { if (beforeMode) document.documentElement.setAttribute('data-theme', beforeMode); beforeMode = null; });
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  window.mountLabThemeBtn = mount;   // 화면이 통째로 교체되는 경우(관리자 로그인 직후)에 버튼을 다시 달기 위해 공개
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';
  const TOKEN = new URLSearchParams(location.search).get('t') || '';

  // 실습실 사용신청 — GAS 쪽 기본 페이지(?page 없음 = 신청서)로 새 탭 이동
  const applyLinkEl = document.getElementById('applyLink');
  if (applyLinkEl) applyLinkEl.href = GAS_URL;
  const boardLinkEl = document.getElementById('boardLink');
  if (boardLinkEl) boardLinkEl.href = 'index.html' + (TOKEN ? ('?t=' + encodeURIComponent(TOKEN)) : '');
  const allRoomsLinkEl = document.getElementById('allRoomsLink');
  if (allRoomsLinkEl) allRoomsLinkEl.href = 'allrooms.html' + (TOKEN ? ('?t=' + encodeURIComponent(TOKEN)) : '');

  // 폰 접속 QR — PC로 이 현황판을 보고 있을 때, 같은 화면을 내 스마트폰으로도 바로 열 수 있게 안내
  const QR_AUTO_CLOSE_SEC = 300; // 5분 뒤 자동으로 닫힘
  let qrCloseTimer = null;
  let qrCountdownTimer = null;

  function openQrModal() {
    const url = location.origin + location.pathname + (TOKEN ? ('?t=' + encodeURIComponent(TOKEN)) : '');
    const box = document.getElementById('qrModalBox');
    box.innerHTML = '';
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
    } catch (e) {
      box.innerHTML = '<div style="padding:40px 10px;color:var(--danger-text);font-size:13px;">QR 생성 실패</div>';
    }
    document.getElementById('qrModalOverlay').classList.add('open');

    let remain = QR_AUTO_CLOSE_SEC;
    const timerEl = document.getElementById('qrModalTimer');
    const renderTimer = () => {
      const m = Math.floor(remain / 60), s = remain % 60;
      timerEl.textContent = '⏱ ' + m + ':' + String(s).padStart(2, '0') + ' 후 자동으로 닫힙니다';
    };
    renderTimer();
    clearInterval(qrCountdownTimer);
    qrCountdownTimer = setInterval(() => {
      remain--;
      if (remain <= 0) { closeQrModal(); return; }
      renderTimer();
    }, 1000);
    clearTimeout(qrCloseTimer);
    qrCloseTimer = setTimeout(closeQrModal, QR_AUTO_CLOSE_SEC * 1000);
  }
  function closeQrModal() {
    document.getElementById('qrModalOverlay').classList.remove('open');
    clearTimeout(qrCloseTimer);
    clearInterval(qrCountdownTimer);
  }

  function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function updateClock() {
    const now = new Date();
    const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clockTime').textContent = t;
  }

  // 직전 화면을 즉시 보여주고(0초 대기) 그 사이에 최신 데이터를 가져와 교체 — "불러오는 중" 공백을 없앰
  const DASH_CACHE_KEY = 'dash_lastData_' + TOKEN;
  function renderCachedSnapshotIfAny() {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(DASH_CACHE_KEY) || 'null'); } catch (e) {}
    if (cached) render(cached, true);
  }
  function load() {
    if (!TOKEN) {
      document.getElementById('gridArea').innerHTML = '<div class="error">링크가 올바르지 않습니다. 관리자에게 문의해주세요.</div>';
      return;
    }
    fetch(GAS_URL + '?page=api&action=dashboard&t=' + encodeURIComponent(TOKEN))
      .then(res => res.json())
      .then(function(res) {
        render(res);
        if (res && res.success) {
          try { localStorage.setItem(DASH_CACHE_KEY, JSON.stringify(res)); } catch (e) {}
        }
      })
      .catch(function(err) {
        // 네트워크 실패 시에도 직전 화면이 이미 떠 있으면 그대로 두고, 처음부터 실패한 경우만 에러 표시
        if (!document.querySelector('.room-card')) {
          document.getElementById('gridArea').innerHTML = '<div class="error">조회 실패: ' + escapeHtml(err.message) + '</div>';
        }
      });
  }

  // 실습실 이름에서 건물명 분리 — "사회과학관(C1) 405호" → "사회과학관(C1)"
  function parseBuilding(name) {
    const m = name.match(/^(.+?\))\s*(.+)$/);
    return m ? m[1] : '기타';
  }
  // 실습실ID에서 건물코드 분리 — "C1-405" → "C1", "N12-324-1" → "N12"
  function parseBuildingCode(roomId) {
    return String(roomId || '').split('-')[0] || '';
  }
  // 이름에서 건물명을 뺀 호실 부분만 분리 — "사회과학관(C1) 405호" → "405호"
  function parseRoomOnly(name) {
    const m = name.match(/^(.+?\))\s*(.+)$/);
    return m ? m[2] : name;
  }

  // 건물코드(parseBuildingCode 결과) → [위도, 경도]
  const BUILDING_COORDS = {
    N1: [37.77037, 128.87368], N2: [37.77140, 128.87322], N4: [37.77282, 128.87335],
    N5: [37.77089, 128.87146], N6: [37.77155, 128.87178], N7: [37.77194, 128.87219],
    N8: [37.77104, 128.87070], N9: [37.77156, 128.87091], N10: [37.77140, 128.87040],
    N11: [37.77201, 128.86813], N12: [37.77187, 128.86954], N13: [37.77079, 128.86883],
    N14: [37.77055, 128.86746], N15: [37.77041, 128.86698], N16: [37.77089, 128.86691],
    N17: [37.77073, 128.86609], N18: [37.77219, 128.86690], N20: [37.77155, 128.86828],
    C1: [37.76978, 128.87320], C2: [37.76870, 128.87226], C3: [37.76885, 128.87128],
    C4: [37.76885, 128.87081], C5: [37.76968, 128.87022], C6: [37.77016, 128.86897],
    C7: [37.76911, 128.86939], C8: [37.76907, 128.86993], C9: [37.76829, 128.87007],
    C10: [37.76832, 128.86831], C11: [37.76883, 128.86919], C12: [37.76767, 128.86931],
    C13: [37.76699, 128.86847], C14: [37.76688, 128.86888], C15: [37.76615, 128.86852],
    C16: [37.76739, 128.86725], C17: [37.76756, 128.87108],
    D3: [37.76694, 128.87129], D4: [37.76670, 128.87188], D5: [37.76617, 128.87217],
    D6: [37.76703, 128.87261], D7: [37.76494, 128.87158], D8: [37.76747, 128.87185],
    D9: [37.76630, 128.87066],
    S1: [37.76525, 128.87031], S2: [37.76566, 128.86985], S3: [37.76515, 128.86957],
    S4: [37.76455, 128.87099]
  };

  function hasNavCoord(roomId) {
    return !!BUILDING_COORDS[parseBuildingCode(roomId)];
  }

  // Leaflet 기본 마커 아이콘이 CDN 경로를 못 찾는 문제 보정
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
  });

  let navMap = null;

  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function openNavModal(roomId, roomLabel) {
    const coord = BUILDING_COORDS[parseBuildingCode(roomId)];
    if (!coord) return;

    document.getElementById('navModalName').textContent = roomLabel;
    document.getElementById('navModalInfo').textContent = '';
    document.getElementById('navModalOverlay').classList.add('open');

    if (navMap) { navMap.remove(); navMap = null; }

    navMap = L.map('navMapContainer').setView(coord, 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(navMap);
    L.marker(coord).addTo(navMap).bindPopup(roomLabel).openPopup();

    const isMobile = window.matchMedia('(pointer: coarse)').matches;
    if (isMobile && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        if (!navMap) return;
        const me = [pos.coords.latitude, pos.coords.longitude];

        L.circleMarker(me, {
          radius: 8, color: 'var(--accent)', fillColor: '#3b82f6', fillOpacity: 0.9, weight: 2
        }).addTo(navMap).bindPopup('현재 위치');

        L.polyline([me, coord], {
          color: 'var(--ok-strong)', weight: 4, opacity: 0.9,
          dashArray: '8, 10', className: 'nav-route-line'
        }).addTo(navMap);

        navMap.fitBounds([me, coord], { padding: [40, 40] });

        const dist = Math.round(haversineMeters(me[0], me[1], coord[0], coord[1]));
        document.getElementById('navModalInfo').innerHTML = '직선거리 약 <span class="dist">' + dist + 'm</span> · 실제 도로 경로와는 다를 수 있어요';
      }, function() {
        document.getElementById('navModalInfo').textContent = '위치 접근이 거부되어 건물 위치만 표시합니다. 아이폰이면 설정 → 개인정보 보호 및 보안 → 위치 서비스 → Safari를 "앱을 사용하는 동안"으로 확인해보세요.';
      }, { enableHighAccuracy: true, timeout: 8000 });
    }
  }

  function closeNavModal() {
    document.getElementById('navModalOverlay').classList.remove('open');
    if (navMap) { navMap.remove(); navMap = null; }
  }

  // 필터 상태
  let filterAvailOnly = false;
  let filterBuilding = '';
  let filterBuildingOptionsBuilt = false;

  function toggleAvailFilter() {
    filterAvailOnly = !filterAvailOnly;
    document.getElementById('availToggle').classList.toggle('active', filterAvailOnly);
    dismissFilterTip();
    if (filterAvailOnly) resetBuildingFilter();
    resetSwFilter();
    applyFilters();
  }

  function setBuildingFilter(b) {
    dismissFilterTip();
    filterBuilding = (filterBuilding === b) ? '' : b;
    document.querySelectorAll('.building-chip').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-b') === filterBuilding);
    });
    resetSwFilter();
    resetAvailFilter();
    applyFilters();
  }

  let filterSw = '';

  // 건물 필터를 새로 고르면, 그 건물의 "가능/불가능 전체"를 보고 싶은 것이지
  // 이전에 눌러둔 "사용가능만 보기"와는 무관하므로 자동으로 꺼줌
  function resetAvailFilter() {
    if (!filterAvailOnly) return;
    filterAvailOnly = false;
    document.getElementById('availToggle').classList.remove('active');
  }

  // 건물 필터가 걸려있는 상태에서 SW를 고르면 "그 건물 안에서만" 검색되는 꼴이 되어
  // 의미가 없으므로, SW를 선택하면 건물 필터를 자동으로 전체로 되돌림
  function resetBuildingFilter() {
    if (!filterBuilding) return;
    filterBuilding = '';
    document.querySelectorAll('.building-chip').forEach(el => {
      el.classList.remove('active');
    });
  }

  // SW 필터만 "마지막으로 SW를 직접 선택했을 때"만 유지되게 하고,
  // 건물 필터나 사용가능 토글처럼 다른 필터를 건드리면 자동으로 전체로 되돌림
  function resetSwFilter() {
    if (!filterSw) return;
    filterSw = '';
    document.getElementById('swDropdownLabel').textContent = '🖥️ SW: 전체';
    document.getElementById('swDropdownBtn').classList.remove('active');
    document.querySelectorAll('#swDropdownPanel .dropdown-item').forEach(el => {
      el.classList.toggle('selected', el.getAttribute('data-sw') === '');
    });
  }

  function buildFilterOptions(res) {
    if (filterBuildingOptionsBuilt) return;
    filterBuildingOptionsBuilt = true;

    const buildings = [...new Set(res.rooms.map(r => parseBuilding(r.roomName)))]
      .sort((a, b) => parseBuildingCode(res.rooms.find(r => parseBuilding(r.roomName) === a).roomId)
        .localeCompare(parseBuildingCode(res.rooms.find(r => parseBuilding(r.roomName) === b).roomId), undefined, { numeric: true }));
    const chipsEl = document.getElementById('buildingChips');
    chipsEl.innerHTML = buildings.map(b =>
      '<button type="button" class="filter-chip building-chip" data-b="' + escapeHtml(b) + '" onclick="setBuildingFilter(\'' + escapeHtml(b).replace(/'/g,"\\'") + '\')">' + escapeHtml(b) + '</button>'
    ).join('');

    const swSet = new Set();
    res.rooms.forEach(r => (r.swTags || []).forEach(s => swSet.add(s)));
    const swList = [...swSet].sort();
    const panel = document.getElementById('swDropdownPanel');
    let html = '<div class="dropdown-item selected" data-sw="" onclick="selectSw(\'\')">전체</div>';
    swList.forEach(s => {
      html += '<div class="dropdown-item" data-sw="' + escapeHtml(s) + '" onclick="selectSw(\'' + escapeHtml(s).replace(/'/g,"\\'") + '\')">' + escapeHtml(s) + '</div>';
    });
    panel.innerHTML = html;
  }

  function toggleSwDropdown() {
    dismissFilterTip();
    document.getElementById('swDropdownPanel').classList.toggle('show');
  }

  function selectSw(sw) {
    filterSw = sw;
    document.getElementById('swDropdownLabel').textContent = '🖥️ SW: ' + (sw || '전체');
    document.getElementById('swDropdownBtn').classList.toggle('active', !!sw);
    document.querySelectorAll('#swDropdownPanel .dropdown-item').forEach(el => {
      el.classList.toggle('selected', el.getAttribute('data-sw') === sw);
    });
    document.getElementById('swDropdownPanel').classList.remove('show');
    resetBuildingFilter();
    resetAvailFilter();
    applyFilters();
  }

  // 드롭다운 바깥을 누르면 닫기
  document.addEventListener('click', function(e) {
    const wrap = document.querySelector('.dropdown-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('swDropdownPanel').classList.remove('show');
    }
  });

  function applyFilters() {
    if (window._lastDashboardRes) render(window._lastDashboardRes);
  }

  // 즐겨찾기 (localStorage — 로그인 없이 이 브라우저에만 저장)
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem('dash_favorites') || '[]'); } catch (e) { return []; }
  }
  function toggleFavorite(roomId, btnEl) {
    let favs = getFavorites();
    const idx = favs.indexOf(roomId);
    if (idx === -1) { favs.push(roomId); if (btnEl) btnEl.classList.add('active'); }
    else { favs.splice(idx, 1); if (btnEl) btnEl.classList.remove('active'); }
    try { localStorage.setItem('dash_favorites', JSON.stringify(favs)); } catch (e) {}
    if (window._lastDashboardRes) render(window._lastDashboardRes);
  }

  function render(res) {
    const scrollY = window.scrollY;
    const area = document.getElementById('gridArea');
    if (!res || !res.success) {
      area.innerHTML = '<div class="error">' + escapeHtml((res&&res.message)||'조회 실패') + '</div>';
      return;
    }
    window._lastDashboardRes = res;
    document.getElementById('clockDate').textContent = res.today;
    const weatherEl = document.getElementById('clockWeather');
    if (res.weather && res.weather.temp !== null && res.weather.temp !== undefined) {
      weatherEl.textContent = '강릉 ' + res.weather.icon + ' ' + res.weather.temp + '°C · ' + res.weather.label;
    } else {
      weatherEl.textContent = '';
    }
    buildFilterOptions(res);

    const filteredRooms = res.rooms.filter(r => {
      if (filterAvailOnly && r.status !== 'available') return false;
      if (filterBuilding && parseBuilding(r.roomName) !== filterBuilding) return false;
      if (filterSw && (r.swTags || []).indexOf(filterSw) === -1) return false;
      return true;
    });

    const commonBar = document.getElementById('commonSwBar');
    if (res.commonSwTags && res.commonSwTags.length > 0) {
      document.getElementById('commonSwTags').innerHTML = res.commonSwTags.map(s => '<span class="sw-tag">' + escapeHtml(s) + '</span>').join(' ');
      commonBar.style.display = 'flex';
    } else {
      commonBar.style.display = 'none';
    }

    const favs = getFavorites();
    const STATUS_ORDER = { available: 0, before_open: 1, in_use: 2, closed: 3 };

    function roomCardHtml(r, showFavStar) {
      const pcLine = (r.status === 'available')
        ? '<span class="pc">' + r.pcCount + '</span><span class="pc-unit">대 사용가능</span>'
        : '학생용 ' + r.pcCount + '대';
      const isFav = favs.indexOf(r.roomId) !== -1;
      let html = '<div class="room-card ' + r.status + '">';
      if (showFavStar) {
        html += '<button class="fav-btn' + (isFav ? ' active' : '') + '" onclick="toggleFavorite(\'' + r.roomId + '\', this)" title="즐겨찾기">' + (isFav ? '★' : '☆') + '</button>';
      }
      if (hasNavCoord(r.roomId)) {
        html += '<button class="nav-btn" data-room-id="' + escapeHtml(r.roomId) + '" data-room-label="' + escapeHtml(parseBuilding(r.roomName) + ' ' + parseRoomOnly(r.roomName)) + '" onclick="openNavModal(this.dataset.roomId, this.dataset.roomLabel)" title="지도에서 위치 보기">📍</button>';
      }
      html += '<div class="badge ' + r.status + '">' + escapeHtml(r.statusLabel) + '</div>';
      html += '<div class="room-name">';
      html += '<div class="building-line">' + escapeHtml(parseBuilding(r.roomName)) + '</div>';
      const roomOnly = parseRoomOnly(r.roomName);
      const roomNum = roomOnly.replace(/호\s*$/, '');
      html += '<div class="room-num-line' + (roomNum.length > 5 ? ' long' : '') + '">' + escapeHtml(roomNum) + (roomNum !== roomOnly ? '<span class="ho">호</span>' : '') + '</div>';
      html += '</div>';
      html += '<div class="room-meta">';
      if (r.availableUntil) html += escapeHtml(r.availableUntil) + '<br>';
      html += pcLine;
      if (r.pcSpec) html += '<br><span style="opacity:0.65;">' + escapeHtml(r.pcSpec) + '</span>';
      html += '</div>';
      if (r.swTags && r.swTags.length > 0) {
        html += '<div class="sw-tags">' + r.swTags.slice(0, 4).map(s => '<span class="sw-tag">' + escapeHtml(s) + '</span>').join('') + '</div>';
      }
      html += '</div>';
      return html;
    }

    let out = '';
    const favRooms = res.rooms.filter(r => favs.indexOf(r.roomId) !== -1)
      .sort((a, b) => (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || a.roomName.localeCompare(b.roomName));
    if (favRooms.length > 0) {
      out += '<div class="fav-section-title">⭐ 즐겨찾기</div>';
      out += '<div class="grid" style="margin-bottom:16px;">' + favRooms.map(r => roomCardHtml(r, true)).join('') + '</div>';
    }

    const allSorted = filteredRooms.slice().sort((a, b) =>
      parseBuildingCode(a.roomId).localeCompare(parseBuildingCode(b.roomId), undefined, { numeric: true }) ||
      (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) ||
      a.roomName.localeCompare(b.roomName)
    );
    out += '<div class="grid">' + allSorted.map(r => roomCardHtml(r, true)).join('') + '</div>';

    area.innerHTML = out || '<div class="error">조건에 맞는 실습실이 없습니다.</div>';

    renderCloseGrid(res.rooms);

    requestAnimationFrame(function() { window.scrollTo(0, scrollY); });
  }

  function renderCloseGrid(rooms) {
    const closeRooms = rooms.filter(r => r.closeTime).slice().sort((a, b) => a.closeTime.localeCompare(b.closeTime));
    const titleEl = document.getElementById('closeSectionTitle');
    const gridEl = document.getElementById('closeGridArea');
    if (closeRooms.length === 0) { titleEl.style.display = 'none'; gridEl.innerHTML = ''; return; }
    titleEl.style.display = 'flex';

    let html = '';
    closeRooms.forEach(r => {
      html += '<div class="close-card' + (r.isException ? ' exception' : '') + '">';
      html += '<span class="cname">' + escapeHtml(r.roomId) + '</span>';
      html += '<span class="ctime">' + escapeHtml(r.closeTime) + '</span>';
      html += '</div>';
    });
    // 휴무인 실습실도 목록 끝에 참고용으로 표시
    rooms.filter(r => !r.closeTime).forEach(r => {
      html += '<div class="close-card"><span class="cname">' + escapeHtml(r.roomId) + '</span><span class="ctime off">휴무</span></div>';
    });
    gridEl.innerHTML = html;
  }
  // 필터 바 첫 방문 안내 — 이 브라우저에서 한 번 보면 다시 뜨지 않음
  let filterTipTimer = null;
  function dismissFilterTip() {
    if (filterTipTimer) { clearTimeout(filterTipTimer); filterTipTimer = null; }
    const tipEl = document.getElementById('filterTip');
    if (tipEl) tipEl.classList.remove('show');
    try { localStorage.setItem('dash_filterTipSeen', '1'); } catch (e) {}
  }
  (function initFilterTip() {
    let seen = false;
    try { seen = !!localStorage.getItem('dash_filterTipSeen'); } catch (e) {}
    if (seen) return;
    setTimeout(() => {
      const tipEl = document.getElementById('filterTip');
      if (tipEl) tipEl.classList.add('show');
      document.getElementById('filterBar').classList.add('attract');
      filterTipTimer = setTimeout(dismissFilterTip, 6000);
    }, 1200);
  })();

  renderCachedSnapshotIfAny();
  load();
  updateClock();
  setInterval(updateClock, 1000);
  let dashTimer = setInterval(load, 30 * 1000);

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      clearInterval(dashTimer);
    } else {
      load();
      dashTimer = setInterval(load, 30 * 1000);
    }
  });
</script>
</body>
</html>
