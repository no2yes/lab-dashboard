<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 실습실 시간표</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  html { scrollbar-color: var(--w25) var(--w04); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--w03); }
  ::-webkit-scrollbar-thumb { background: var(--w22); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--w35); background-clip: padding-box; }
  body {
    font-family: 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    color:var(--text);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--w15);
  }
  .title { font-size: 18px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  .title .sub { font-size: 11px; font-weight: 400; opacity: 0.6; }
  .clock { text-align: right; }
  .clock .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock .date { font-size: 11px; opacity: 0.65; margin-top: 2px; }

  .daybar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .day-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .day-btn {
    position: relative;
    overflow: hidden;
    background: var(--w08);
    border: 1px solid var(--w18);
    color: var(--w90);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .day-btn:hover { background: var(--w16); border-color: var(--w35); }
  .day-btn.today { background: rgba(74,222,128,0.2); border-color: #4ade80; color: var(--ok-text); }
  .day-btn .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--w30);
    z-index: 0;
  }
  /* 다음날: 왼쪽 → 오른쪽으로 채워짐 (기본값, 진행 방향과 일치) */
  /* 전날: 오른쪽 → 왼쪽으로 채워짐 (왼쪽 방향 진행과 일치) */
  #btnPrev .fill { left: auto; right: 0; }
  /* 오늘: 방향성이 없으므로 가운데서 양옆으로 펼쳐짐 */
  #todayBtn .fill { left: 50%; right: auto; transform: translateX(-50%); }
  .day-btn.today .fill { background: rgba(74,222,128,0.5); }
  .day-btn .label { position: relative; z-index: 1; }

  /* 날짜 직접 선택 (커스텀 캘린더 팝업) */
  .date-pick-wrap { position: relative; margin-left: 2px; }
  .cal-popup {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 50;
    width: 230px;
    background: var(--surface-pop);
    border: 1px solid var(--w20);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 12px 32px rgba(var(--sh),calc(0.45 * var(--shk)));
    display: none;
  }
  .cal-popup.open { display: block; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
  .cal-head button { background: transparent; border: none; color:var(--text); cursor: pointer; font-size: 13px; padding: 3px 9px; border-radius: 6px; font-family: inherit; }
  .cal-head button:hover { background: var(--w14); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11px; text-align: center; }
  .cal-dow { opacity: 0.5; padding: 4px 0 6px; font-weight: 600; }
  .cal-day { padding: 6px 0; border-radius: 6px; cursor: pointer; color: var(--w90); }
  .cal-day:hover { background: var(--w16); }
  .cal-day.other-month { opacity: 0.3; }
  .cal-day.today { border: 1px solid #4ade80; color: var(--ok-text); }
  .cal-day.selected { background: rgba(96,165,250,0.45); font-weight: 800; }
  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11px; opacity: 0.8; }
  .legend .sw { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .dot.regular { background: var(--danger-line); }
  .legend .dot.reserved { background: #60a5fa; }

  .aw-wrap {
    background: var(--w05);
    border: 1px solid var(--w12);
    border-radius: 14px;
    padding: 14px;
    overflow-x: auto;
    flex: 1;
  }
  .aw-grid { display: grid; gap: 4px; min-width: max-content; }
  .aw-room-header {
    background: var(--w10);
    border: 1px solid var(--w16);
    color:var(--text);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    padding: 6px 4px;
    border-radius: 6px;
    position: relative;
    line-height: 1.4;
  }
  .aw-hint { text-align: center; margin: 4px 0 10px; }
  .aw-hint span { display: inline-block; background: rgba(127,179,255,0.16); border: 1px solid rgba(127,179,255,0.45); color: var(--accent-soft); font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 20px; }
  .aw-room-link { display: block; text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s; }
  .aw-room-link:hover { background: rgba(127,179,255,0.28); border-color: rgba(127,179,255,0.7); }
  .aw-time-col { width: 44px; font-size: 10px; color: var(--w55); text-align: center; }
  .aw-col { width: 130px; position: relative; border: 1px solid var(--line-soft); background: var(--w03); border-radius: 4px; }
  .aw-cell { height: 20px; border-bottom: 1px dashed var(--line-soft); }
  .aw-block {
    position: absolute;
    left: 2px; right: 2px;
    border-radius: 5px;
    padding: 2px 5px;
    font-size: 10px;
    overflow: hidden;
    box-sizing: border-box;
    line-height: 1.3;
  }
  .aw-block.regular { background: rgba(248,113,113,0.22); border-left: 3px solid var(--danger-line); color: var(--danger-text); }
  .aw-block.reserved { background: rgba(96,165,250,0.22); border-left: 3px solid #60a5fa; color: var(--accent-soft); }
  .aw-block .bt { font-weight: 800; }
  @keyframes awBlockFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .aw-block { animation: awBlockFadeIn 0.35s ease; }
  .aw-now-line {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dashed var(--danger-line);
    box-shadow: 0 0 4px rgba(248,113,113,0.6);
    z-index: 20;
  }
  .aw-now-label {
    position: absolute; left: 2px; top: -9px;
    background: var(--danger-line); color: #1a1a1a; font-size: 9px; font-weight: 800;
    padding: 1px 5px; border-radius: 8px; z-index: 21;
  }
  .aw-loading, .aw-error { text-align: center; padding: 60px 20px; color: var(--w60); font-size: 14px; }

  .footer { text-align: center; font-size: 11px; opacity: 0.5; margin-top: 14px; }
  .footer-link { color: inherit; text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .daybar { flex-direction: column; align-items: stretch; }
    .legend { order: 3; }
  }
</style>

option { background: var(--surface-pop); color: var(--text); }

/* 테마 전환 버튼 */
#labThemeBtn {
  position: fixed; left: 14px; bottom: 14px; z-index: 99999;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--w22); background: var(--surface-pop); color: var(--text);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0;
  box-shadow: 0 2px 10px rgba(var(--sh), calc(.35 * var(--shk)));

<script>
(function () {
  var KEY = 'lab_theme', mode = 'dark';
  try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'dark';
  function apply(m) {
    mode = m;
    document.documentElement.setAttribute('data-theme', m);
    var b = document.getElementById('labThemeBtn');
    if (b) {
      b.textContent = (m === 'dark') ? '\u2600\uFE0F' : '\uD83C\uDF19';
      b.title = (m === 'dark') ? '\uD654\uC774\uD2B8 \uD14C\uB9C8\uB85C \uC804\uD658' : '\uB2E4\uD06C \uD14C\uB9C8\uB85C \uC804\uD658';
      b.setAttribute('aria-label', b.title);
    }
  }
  window.toggleLabTheme = function () {
    var next = (mode === 'dark') ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  apply(mode);
  function mount() {
    if (document.getElementById('labThemeBtn') || !document.body) return;
    var b = document.createElement('button');
    b.id = 'labThemeBtn'; b.type = 'button';
    b.onclick = window.toggleLabTheme;
    document.body.appendChild(b);
    apply(mode);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>

<body>
  <div class="top">
    <div class="title">🖥️ 전체 실습실 시간표<span class="sub">강원대학교 강릉캠퍼스 · 오늘 각 실습실의 정규수업·예약 현황을 한눈에 보여줍니다</span></div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate"></div>
    </div>
  </div>

  <div class="daybar">
    <div class="day-nav">
      <button type="button" class="day-btn" id="btnPrev" onclick="dayPrev()"><span class="fill"></span><span class="label">◀ 전날</span></button>
      <button type="button" class="day-btn today" id="todayBtn" onclick="dayToday()"><span class="fill"></span><span class="label">오늘</span></button>
      <button type="button" class="day-btn" id="btnNext" onclick="dayNext()"><span class="fill"></span><span class="label">다음날 ▶</span></button>
      <div class="date-pick-wrap" id="datePickWrap">
        <button type="button" class="day-btn" id="datePickBtn" onclick="toggleCalPopup()" title="날짜 선택 (클릭하면 달력이 열립니다)">
          <span class="fill"></span><span class="label" id="datePickLabel">📅 날짜</span>
        </button>
        <div class="cal-popup" id="calPopup">
          <div class="cal-head">
            <button type="button" onclick="calPrevMonth(event)">◀</button>
            <span id="calMonthLabel"></span>
            <button type="button" onclick="calNextMonth(event)">▶</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>
    </div>
    <div class="legend">
      <span class="sw"><span class="dot regular"></span>정규수업</span>
      <span class="sw"><span class="dot reserved"></span>예약됨</span>
    </div>
  </div>

  <div class="aw-hint"><span>👇 아래 실습실 이름을 누르면, 선택한 날짜로 바로 신청할 수 있어요</span></div>

  <div class="aw-wrap">
    <div id="arArea" class="aw-loading">불러오는 중...</div>
  </div>

  <div class="footer">실습실 현황판으로 돌아가기 · <a class="footer-link" id="backLink" href="dashboard.html">실습실 현황판</a></div>

<script>
  // ▼▼▼ GAS 배포 주소 (dashboard.html / index.html과 동일) ▼▼▼
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdFualGxneSbdscvcDxOnIXqqYq2zoK6uZe_c10zog07Cew6F8HUzjNeN7cCnuZ9C0/exec';
  // ▲▲▲

  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  const backLinkEl = document.getElementById('backLink');
  if (backLinkEl) backLinkEl.href = 'dashboard.html' + (TOKEN ? ('?t=' + encodeURIComponent(TOKEN)) : '');

  const START_HOUR = 9, END_HOUR = 22, SLOT_MIN = 30;
  let dayOffset = 0;
  let autoRefreshTimer = null;

  function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function t2m(t) { const p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }

  function updateClock() {
    const now = new Date();
    document.getElementById('clockTime').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clockDate').textContent =
      (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + ['일','월','화','수','목','금','토'][now.getDay()] + '요일';
  }

  function dayPrev() { setActiveNavBtn('btnPrev'); dayOffset--; load(); }
  function dayNext() { setActiveNavBtn('btnNext'); dayOffset++; load(); }
  function dayToday() { setActiveNavBtn('todayBtn'); dayOffset = 0; load(); }

  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => { if (dayOffset === 0) { setActiveNavBtn('todayBtn'); load(); } }, 5 * 60 * 1000);
  }

  // 날짜를 직접 선택하면, 그 날짜가 오늘보다 미래/과거/오늘인지에 따라
  // 다음날(좌→우)/전날(우→좌)/오늘(가운데서 확산)과 같은 방향으로 게이지가 채워지게 함
  const NAV_BTN_IDS = ['btnPrev', 'todayBtn', 'btnNext', 'datePickBtn'];
  function formatLocalISODate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // 커스텀 날짜 선택 캘린더 (브라우저 기본 달력 팝업의 불필요한 "삭제" 버튼을 없애기 위해 직접 구현)
  const calPopupEl = document.getElementById('calPopup');
  const datePickWrapEl = document.getElementById('datePickWrap');
  let calViewDate = new Date();

  function toggleCalPopup() {
    if (calPopupEl.classList.contains('open')) { closeCalPopup(); return; }
    const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() + dayOffset);
    calViewDate = new Date(base.getFullYear(), base.getMonth(), 1);
    renderCalendarGrid();
    calPopupEl.classList.add('open');
  }
  function closeCalPopup() { calPopupEl.classList.remove('open'); }
  document.addEventListener('click', function(e) {
    if (datePickWrapEl && !datePickWrapEl.contains(e.target)) closeCalPopup();
  });
  function calPrevMonth(e) { e.stopPropagation(); calViewDate.setMonth(calViewDate.getMonth() - 1); renderCalendarGrid(); }
  function calNextMonth(e) { e.stopPropagation(); calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendarGrid(); }

  function renderCalendarGrid() {
    const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
    document.getElementById('calMonthLabel').textContent = year + '년 ' + (month + 1) + '월';

    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const selectedDate = new Date(today0); selectedDate.setDate(selectedDate.getDate() + dayOffset);

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const cells = [];
    for (let i = 0; i < firstDow; i++) {
      const d = daysInPrevMonth - firstDow + 1 + i;
      cells.push({ day: d, other: true, dateObj: new Date(year, month - 1, d) });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, other: false, dateObj: new Date(year, month, d) });
    }
    let nextDay = 1;
    while (cells.length < 42) {
      cells.push({ day: nextDay, other: true, dateObj: new Date(year, month + 1, nextDay) });
      nextDay++;
    }

    let html = ['일', '월', '화', '수', '목', '금', '토'].map(d => '<div class="cal-dow">' + d + '</div>').join('');
    cells.forEach(c => {
      const cls = ['cal-day'];
      if (c.other) cls.push('other-month');
      if (c.dateObj.getTime() === today0.getTime()) cls.push('today');
      if (c.dateObj.getTime() === selectedDate.getTime()) cls.push('selected');
      html += '<div class="' + cls.join(' ') + '" data-date="' + formatLocalISODate(c.dateObj) + '">' + c.day + '</div>';
    });
    document.getElementById('calGrid').innerHTML = html;
    document.getElementById('calGrid').querySelectorAll('.cal-day').forEach(el => {
      el.addEventListener('click', function() { pickCalDate(this.dataset.date); });
    });
  }

  function pickCalDate(dateStr) {
    const picked = new Date(dateStr + 'T00:00:00');
    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const diffDays = Math.round((picked - today0) / 86400000);
    const dir = diffDays > 0 ? 'ltr' : (diffDays < 0 ? 'rtl' : 'center');
    closeCalPopup();
    setActiveNavBtn('datePickBtn', dir);
    dayOffset = diffDays;
    load();
  }

  // 로딩 중인 버튼에 "게이지가 차오르는" 효과를 줘서 어떤 날짜가 바뀌는 중인지 표시
  // dir을 지정하면(날짜 선택 등) 그 방향으로, 지정하지 않으면 버튼별 기본 CSS 방향을 그대로 씀
  let activeNavBtnId = 'todayBtn';
  function setActiveNavBtn(id, dir) {
    activeNavBtnId = id;
    NAV_BTN_IDS.forEach(bid => {
      const btn = document.getElementById(bid);
      const fill = btn && btn.querySelector('.fill');
      if (!fill) return;
      if (bid === id) {
        if (dir === 'ltr') { fill.style.left = '0'; fill.style.right = 'auto'; fill.style.transform = 'none'; }
        else if (dir === 'rtl') { fill.style.left = 'auto'; fill.style.right = '0'; fill.style.transform = 'none'; }
        else if (dir === 'center') { fill.style.left = '50%'; fill.style.right = 'auto'; fill.style.transform = 'translateX(-50%)'; }
        fill.style.transition = 'none';
        fill.style.opacity = '1';
        fill.style.width = '0%';
        void fill.offsetWidth;  // 강제 리플로우 — 바로 다음 transition이 처음부터 다시 재생되도록
        fill.style.transition = 'width 3.2s cubic-bezier(0.08,0.6,0.15,1)';
        fill.style.width = '85%';
      } else {
        fill.style.transition = 'none';
        fill.style.opacity = '1';
        fill.style.width = '0%';
      }
    });
  }
  function finishActiveNavBtn() {
    const btn = document.getElementById(activeNavBtnId);
    const fill = btn && btn.querySelector('.fill');
    if (!fill) return;
    fill.style.transition = 'width 0.25s ease';
    fill.style.width = '100%';
    setTimeout(() => {
      // 왼쪽으로 줄어들며 되돌아가는 대신, 다 채워진 상태로 그대로 페이드아웃
      fill.style.transition = 'opacity 0.4s ease';
      fill.style.opacity = '0';
      setTimeout(() => {
        fill.style.transition = 'none';
        fill.style.width = '0%';
        fill.style.opacity = '1';
      }, 420);
    }, 250);
  }

  // 날짜를 넘길 때 "이전 날짜의 수업"이 잠깐 겹쳐 보이는 걸 막기 위해,
  // 실제 수업·예약 데이터는 캐시하지 않고 "실습실 목록(틀)"만 캐시해서
  // 매번 빈 틀을 먼저 그린 뒤, 데이터가 도착하면 그 자리에 페이드인시킨다.
  const ROOMS_CACHE_KEY = 'allrooms_rooms_' + TOKEN;
  function getCachedRooms() {
    try { return JSON.parse(localStorage.getItem(ROOMS_CACHE_KEY) || 'null'); } catch (e) { return null; }
  }
  function cacheRooms(rooms) {
    try { localStorage.setItem(ROOMS_CACHE_KEY, JSON.stringify(rooms.map(r => ({ id: r.id, name: r.name })))); } catch (e) {}
  }

  function renderSkeleton(rooms) {
    const totalSlots = ((END_HOUR - START_HOUR) * 60) / SLOT_MIN;
    const gridCols = '44px repeat(' + rooms.length + ', 130px)';
    let html = '<div class="aw-grid" style="grid-template-columns:' + gridCols + ';">';
    html += '<div></div>';
    rooms.forEach(r => {
      const m = r.name.match(/^(.+?)\)\s*(.+)$/);
      let line1, line2;
      if (m) { line1 = m[1] + ')'; line2 = m[2]; }
      else { line1 = r.name; line2 = ''; }
      html += '<div class="aw-room-header">' +
              '<div>' + escapeHtml(line1) + '</div>' +
              (line2 ? '<div>' + escapeHtml(line2) + '</div>' : '') + '</div>';
    });
    html += '<div style="position:relative;">';
    for (let s = 0; s <= totalSlots; s++) {
      const totalMin = START_HOUR * 60 + s * SLOT_MIN;
      const h = Math.floor(totalMin / 60), m = totalMin % 60;
      if (m === 0) {
        html += '<div class="aw-time-col" style="position:absolute;top:' + (s * 20 - 6) + 'px;width:44px;">' + String(h).padStart(2, '0') + ':00</div>';
      }
    }
    html += '</div>';
    rooms.forEach(() => {
      html += '<div class="aw-col" style="height:' + (totalSlots * 20) + 'px;opacity:0.5;">';
      for (let s = 0; s < totalSlots; s++) html += '<div class="aw-cell"></div>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('arArea').innerHTML = html;
  }

  // 날짜 버튼에는 현재 보고 있는 날짜를 표시
  function updateDateLabel() {
    const el = document.getElementById('datePickLabel');
    if (!el) return;
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + dayOffset);
    el.textContent = '📅 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + ')';
  }

  function load() {
    updateDateLabel();
    if (!TOKEN) {
      document.getElementById('arArea').innerHTML = '<div class="aw-error">접속 주소에 인증 정보(?t=...)가 없습니다. 관리자에게 링크를 다시 요청해주세요.</div>';
      return;
    }
    const cachedRooms = getCachedRooms();
    if (cachedRooms && cachedRooms.length) {
      renderSkeleton(cachedRooms);
    } else {
      document.getElementById('arArea').innerHTML = '<div class="aw-loading">불러오는 중...</div>';
    }
    fetch(GAS_URL + '?page=api&action=allrooms&t=' + encodeURIComponent(TOKEN) + '&dayOffset=' + dayOffset)
      .then(res => res.json())
      .then(function(res) {
        render(res);
        if (res && res.success && res.rooms) cacheRooms(res.rooms);
        finishActiveNavBtn();
      })
      .catch(err => {
        if (!document.querySelector('.aw-block')) {
          document.getElementById('arArea').innerHTML = '<div class="aw-error">조회 실패: ' + escapeHtml(err.message) + '</div>';
        }
        finishActiveNavBtn();
      });
  }

  function render(res) {
    if (!res || !res.success) {
      document.getElementById('arArea').innerHTML = '<div class="aw-error">' + escapeHtml((res && res.message) || '조회 실패') + '</div>';
      return;
    }

    document.getElementById('todayBtn').classList.toggle('today', !!res.isToday);

    const rooms = res.rooms;
    const totalSlots = ((END_HOUR - START_HOUR) * 60) / SLOT_MIN;
    const gridCols = '44px repeat(' + rooms.length + ', 130px)';

    const selDate = new Date(); selDate.setHours(0, 0, 0, 0); selDate.setDate(selDate.getDate() + dayOffset);
    const selDateStr = formatLocalISODate(selDate);
    let html = '<div class="aw-grid" style="grid-template-columns:' + gridCols + ';">';
    html += '<div></div>';
    rooms.forEach(r => {
      const m = r.name.match(/^(.+?)\)\s*(.+)$/);
      let line1, line2;
      if (m) { line1 = m[1] + ')'; line2 = m[2]; }
      else { line1 = r.name; line2 = ''; }
      html += '<a class="aw-room-header aw-room-link" href="' + GAS_URL + '?room=' + encodeURIComponent(r.id) + '&date=' + selDateStr + '" target="_blank" rel="noopener" title="이 실습실 신청하기">' +
              '<div>' + escapeHtml(line1) + '</div>' +
              (line2 ? '<div>' + escapeHtml(line2) + '</div>' : '') + '</a>';
    });

    html += '<div style="position:relative;">';
    for (let s = 0; s <= totalSlots; s++) {
      const totalMin = START_HOUR * 60 + s * SLOT_MIN;
      const h = Math.floor(totalMin / 60), m = totalMin % 60;
      if (m === 0) {
        html += '<div class="aw-time-col" style="position:absolute;top:' + (s * 20 - 6) + 'px;width:44px;">' + String(h).padStart(2, '0') + ':00</div>';
      }
    }
    html += '</div>';

    rooms.forEach(r => {
      html += '<div class="aw-col" style="height:' + (totalSlots * 20) + 'px;">';
      for (let s = 0; s < totalSlots; s++) html += '<div class="aw-cell"></div>';
      r.blocks.forEach(b => {
        const bs = t2m(b.start), be = t2m(b.end);
        const top = ((bs - START_HOUR * 60) / SLOT_MIN) * 20;
        const height = ((be - bs) / SLOT_MIN) * 20;
        const cls = (b.type === '정규수업') ? 'regular' : 'reserved';
        html += '<div class="aw-block ' + cls + '" style="top:' + top + 'px;height:' + height + 'px;">' +
                '<div class="bt">' + b.start + '~' + b.end + '</div><div>' + escapeHtml(b.label) + '</div></div>';
      });
      html += '</div>';
    });
    html += '</div>';

    document.getElementById('arArea').innerHTML = html;
    if (res.isToday) drawNowLine(totalSlots);
  }

  function drawNowLine(totalSlots) {
    const grid = document.querySelector('.aw-grid');
    if (!grid) return;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const rangeStart = START_HOUR * 60, rangeEnd = END_HOUR * 60;
    if (nowMin < rangeStart || nowMin > rangeEnd) return;
    const top = ((nowMin - rangeStart) / SLOT_MIN) * 20;

    const cols = document.querySelectorAll('.aw-col');
    cols.forEach(col => {
      const line = document.createElement('div');
      line.className = 'aw-now-line';
      line.style.top = top + 'px';
      col.appendChild(line);
    });
    if (cols[0]) {
      const label = document.createElement('div');
      label.className = 'aw-now-label';
      label.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      label.style.top = top + 'px';
      cols[0].appendChild(label);
    }
  }

  setActiveNavBtn('todayBtn');
  load();
  startAutoRefresh();
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
